name: Deploy Contacts Worker

on:
  push:
    branches: [main]
    paths:
      - 'contacts-worker/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wrangler
        run: npm install -g wrangler@3

      - name: Show wrangler version
        run: wrangler --version

      - name: Show config
        run: cat contacts-worker/wrangler.toml

      - name: Deploy Worker (verbose)
        run: |
          cd contacts-worker
          wrangler deploy --verbose 2>&1
        continue-on-error: true

      - name: Deploy Worker (retry without verbose)
        run: |
          cd contacts-worker
          wrangler deploy 2>&1
