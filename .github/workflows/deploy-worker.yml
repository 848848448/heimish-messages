name: Deploy Contacts Worker

on:
  push:
    branches: [main]
    paths:
      - 'contacts-worker/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wrangler
        run: npm install -g wrangler@latest

      - name: Create KV namespace & get ID
        id: kv
        run: |
          cd contacts-worker
          # Try to list existing namespaces
          wrangler kv namespace list > /tmp/kv_list.txt 2>&1 || true
          cat /tmp/kv_list.txt
          
          # Extract ID if exists
          KV_ID=$(cat /tmp/kv_list.txt | grep -A2 'heimish-contacts' | grep '"id"' | head -1 | grep -oE '"[a-f0-9]{32}"' | tr -d '"' || echo "")
          
          if [ -z "$KV_ID" ]; then
            # Create new namespace
            wrangler kv namespace create "heimish-contacts" > /tmp/kv_create.txt 2>&1 || true
            cat /tmp/kv_create.txt
            KV_ID=$(cat /tmp/kv_create.txt | grep -oE '[a-f0-9]{32}' | head -1 || echo "")
          fi
          
          echo "KV_ID=$KV_ID"
          echo "KV_ID=$KV_ID" >> $GITHUB_ENV

      - name: Update wrangler.toml
        run: |
          if [ -z "$KV_ID" ]; then
            echo "No KV ID found, removing KV binding..."
            sed -i '/\[\[kv_namespaces\]\]/,/^$/d' contacts-worker/wrangler.toml
          else
            sed -i "s/PLACEHOLDER/$KV_ID/" contacts-worker/wrangler.toml
          fi
          cat contacts-worker/wrangler.toml

      - name: Deploy Worker
        run: wrangler deploy
        working-directory: contacts-worker
