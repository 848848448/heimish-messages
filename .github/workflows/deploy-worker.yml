name: Deploy Contacts Worker

on:
  push:
    branches: [main]
    paths: ['contacts-worker/**']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Wrangler
        run: npm install -g wrangler
      - name: Create KV namespace
        run: |
          cd contacts-worker
          KV_OUTPUT=$(wrangler kv:namespace create "heimish-contacts" 2>&1 || true)
          KV_ID=$(echo "$KV_OUTPUT" | grep '"id"' | sed 's/.*"\([^"]*\)".*/\1/' || \
                  wrangler kv:namespace list 2>/dev/null | python3 -c "import sys,json; ns=json.load(sys.stdin); print(next(n['id'] for n in ns if n['title']=='heimish-contacts-contacts'),'')" 2>/dev/null || echo "")
          if [ -n "$KV_ID" ]; then
            sed -i "s/PLACEHOLDER/$KV_ID/" wrangler.toml
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      - name: Deploy Worker
        run: wrangler deploy
        working-directory: contacts-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
