name: Deploy Contacts Worker
on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Deploy Worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy --name heimish-contacts

      # The worker reads ADMIN_TOKEN as a Cloudflare secret. Push the same
      # repo secret the APK is built with (build.yml), so the two always match.
      - name: Set ADMIN_TOKEN secret on the worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          if [ -z "$ADMIN_TOKEN" ]; then
            echo "::error::Repository secret ADMIN_TOKEN is empty; the worker would answer 503."
            exit 1
          fi
          printf '%s' "$ADMIN_TOKEN" | wrangler secret put ADMIN_TOKEN --name heimish-contacts

      - name: Check the live worker
        env:
          WORKER_URL: ${{ vars.HEIMISH_WORKER_URL }}
        run: |
          sleep 5
          if [ -n "$WORKER_URL" ]; then
            curl -sS --max-time 20 "$WORKER_URL/ping" || echo "::warning::$WORKER_URL/ping did not answer — check the HEIMISH_WORKER_URL repo variable"
          fi
