name: Deploy Contacts Worker

on:
  push:
    branches: [main]
    paths: ['contacts-worker/**']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Get or Create KV namespace
        id: kv
        run: |
          # Try to get existing namespace
          EXISTING=$(wrangler kv:namespace list 2>/dev/null | python3 -c "
import sys, json
try:
    data = json.load(sys.stdin)
    ns = next((n for n in data if n.get('title') == 'heimish-contacts'), None)
    print(ns['id'] if ns else '')
except: print('')
" 2>/dev/null || echo "")

          if [ -n "$EXISTING" ]; then
            echo "Found existing KV: $EXISTING"
            echo "kv_id=$EXISTING" >> $GITHUB_OUTPUT
          else
            echo "Creating new KV namespace..."
            OUTPUT=$(wrangler kv:namespace create "heimish-contacts" 2>&1)
            echo "$OUTPUT"
            KV_ID=$(echo "$OUTPUT" | grep -oP '(?<="id": ")[^"]+' | head -1)
            echo "kv_id=$KV_ID" >> $GITHUB_OUTPUT
          fi

      - name: Update wrangler.toml with KV ID
        run: |
          KV_ID="${{ steps.kv.outputs.kv_id }}"
          if [ -n "$KV_ID" ]; then
            sed -i "s/PLACEHOLDER/$KV_ID/" contacts-worker/wrangler.toml
            echo "Updated wrangler.toml with KV ID: $KV_ID"
          else
            echo "ERROR: Could not get KV ID"
            exit 1
          fi

      - name: Deploy Worker
        run: wrangler deploy
        working-directory: contacts-worker
