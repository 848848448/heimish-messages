name: Sync Admin Password
# Pushes the repo secret ADMIN_PASSWORD into the contacts worker when the worker doesn't accept it yet
# (just added, or changed in GitHub). Runs every 10 minutes and does nothing when they already match
# or when the secret isn't set. Run it by hand from the Actions tab for an immediate push.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: worker-secrets
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check
        id: check
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          WORKER_URL: ${{ vars.HEIMISH_WORKER_URL }}
        run: |
          if [ -z "$ADMIN_PASSWORD" ]; then echo "ADMIN_PASSWORD repo secret not set; nothing to do."; echo "push=no" >> "$GITHUB_OUTPUT"; exit 0; fi
          URL="${WORKER_URL:-https://heimish-contacts.abdeveloping.workers.dev}"
          code=$(jq -n --arg p "$ADMIN_PASSWORD" '{password:$p}' | curl -s -o /dev/null -w '%{http_code}' --max-time 20 -X POST -H 'Content-Type: application/json' --data-binary @- "$URL/admin/login")
          echo "Login with the repo password answered HTTP $code"
          case "$code" in
            200) echo "Worker already has this password."; echo "push=no" >> "$GITHUB_OUTPUT" ;;
            401|503) echo "push=yes" >> "$GITHUB_OUTPUT" ;;
            *) echo "::warning::Unexpected answer $code; not pushing."; echo "push=no" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Push ADMIN_PASSWORD to the worker
        if: steps.check.outputs.push == 'yes'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          printf '%s' "$ADMIN_PASSWORD" | npx -y wrangler@4 secret put ADMIN_PASSWORD --name heimish-contacts
          echo "Pushed. Admin login now uses the password from GitHub."
