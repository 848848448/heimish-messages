name: QA emulator
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/qa.yml', 'qa/**']
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Signing key
        run: echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/message.jks"
      - name: Build
        env:
          BUILD_NUMBER: '9999'
          KEYSTORE_PATH: ${{ runner.temp }}/message.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: message
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          HEIMISH_WORKER_URL: ${{ vars.HEIMISH_WORKER_URL }}
        run: chmod +x ./gradlew && ./gradlew assembleDebug --no-daemon
      - name: Emulator QA
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash qa/qa.sh
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-evidence
          path: qa/out/
          if-no-files-found: warn
