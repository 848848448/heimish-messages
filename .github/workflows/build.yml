name: Build APK
on:
  push:
    branches: [main]
    paths: ['app/**', '*.gradle*', 'gradle/**']
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Signing key
        run: echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/message.jks"
      - name: Build
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/message.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: message
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          HEIMISH_WORKER_URL: ${{ vars.HEIMISH_WORKER_URL }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug 2>&1 | tee build.log || true
          if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "=== BUILD FAILED ==="
            grep -E "^e: |error:|FAILURE" build.log | head -50 > /tmp/errs.txt
            cat /tmp/errs.txt
            exit 1
          fi
      - name: Post errors
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f /tmp/errs.txt ]; then
            gh issue create -t "Build errors" -b "$(cat /tmp/errs.txt)" || true
          elif [ -f build.log ]; then
            grep -E "^e: |error:|FAILURE" build.log | head -50 > /tmp/errs.txt
            gh issue create -t "Build errors" -b "$(cat /tmp/errs.txt)" || true
          fi
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: message-apk
          path: app/build/outputs/apk/debug/app-debug.apk
  qa:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: message-apk
          path: app/build/outputs/apk/debug/
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Emulator QA
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash qa/qa.sh
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-evidence
          path: qa/out/
          if-no-files-found: warn
  release:
    needs: qa
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: message-apk
          path: app/build/outputs/apk/debug/
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.6-b${{ github.run_number }}
          name: "Message v3.6.${{ github.run_number }}"
          body_path: RELEASE_NOTES.md
          files: app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
