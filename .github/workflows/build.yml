name: Build APK
on:
  push:
    branches: [main]
    paths: ['app/**', '*.gradle*', 'gradle/**']
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug 2>&1 | tee build.log || true
          if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "=== BUILD FAILED ==="
            grep -E "^e: |error:|FAILURE" build.log | head -50 > /tmp/errs.txt
            cat /tmp/errs.txt
            exit 1
          fi
      - name: Post errors
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f /tmp/errs.txt ]; then
            gh issue create -t "Build errors" -b "$(cat /tmp/errs.txt)" || true
          elif [ -f build.log ]; then
            grep -E "^e: |error:|FAILURE" build.log | head -50 > /tmp/errs.txt
            gh issue create -t "Build errors" -b "$(cat /tmp/errs.txt)" || true
          fi
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: heimish-messages-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.6-b${{ github.run_number }}
          name: "Heimish Messages v2.6"
          body: "📱 Tap **app-debug.apk** to download."
          files: app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
