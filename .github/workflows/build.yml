name: Build APK
on:
  push:
    branches: [main]
    paths: ['app/**', '*.gradle*', 'gradle/**']
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug 2>&1 | tee build.log || true
          if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "BUILD FAILED - errors:"
            grep -E "^e:|error:|FAILURE|ERROR" build.log | head -50
            # Create issue with errors
            BODY=$(grep -E "^e:|error:|FAILURE|ERROR" build.log | head -50)
            curl -s -X POST \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/${{ github.repository }}/issues" \
              -d "$(python3 -c "import json; print(json.dumps({'title':'Build errors','body':'''$BODY'''}))")" || true
            exit 1
          fi
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: heimish-messages-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.5-b${{ github.run_number }}
          name: "Heimish Messages v1.5"
          body: "📱 Tap **app-debug.apk** to download."
          files: app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
