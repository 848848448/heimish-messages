name: Build APK
on:
  push:
    branches: [ main ]
    paths: ['app/**', '*.gradle*', 'gradle/**']
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build
        id: build
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug 2>&1 | tee build.log
        continue-on-error: true
      - name: Post errors on failure
        if: steps.build.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ERRS=$(grep -E "^e:|error:|FAILURE|ERROR" build.log | head -40)
          gh issue create --title "Build failed $(date +%m%d-%H%M)" --body "$(echo "$ERRS")" || true
          exit 1
      - name: Find APK
        id: apk
        run: |
          APK=$(find app/build -name "*.apk" -type f | head -1)
          echo "path=$APK" >> $GITHUB_OUTPUT
          echo "Found APK at: $APK"
          ls -la "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: heimish-messages-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 90
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4-b${{ github.run_number }}
          name: "Heimish Messages v1.4"
          body: "📱 Tap the APK file below to download and install."
          files: ${{ steps.apk.outputs.path }}
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
