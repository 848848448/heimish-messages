name: Build APK

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - '*.gradle*'
      - 'gradle/**'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
      - run: chmod +x ./gradlew

      - name: Build Debug APK
        id: build
        run: |
          ./gradlew assembleDebug 2>&1 | tee build.log
          echo "result=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Post errors to issue on failure
        if: steps.build.outcome == 'failure'
        run: |
          ERRORS=$(grep -E "^e: |error:|FAILURE" build.log | head -30 | jq -Rs .)
          curl -s -X POST \
            -H "Authorization: token ${{ github.token }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues" \
            -d "{\"title\":\"Build failed $(date +%Y%m%d-%H%M)\",\"body\":\"Build errors:\\n\\n\`\`\`\\n$(grep -E '^e: |error:|FAILURE' build.log | head -30)\\n\`\`\`\"}"

      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Get version info
        id: ver
        run: |
          VER=$(grep versionName app/build.gradle.kts | grep -oP '"\K[^"]+')
          CODE=$(grep versionCode app/build.gradle.kts | grep -oP '\d+')
          echo "name=$VER" >> $GITHUB_OUTPUT
          echo "code=$CODE" >> $GITHUB_OUTPUT

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: heimish-messages-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}-${{ steps.ver.outputs.code }}
          name: "Heimish Messages v${{ steps.ver.outputs.name }}"
          body: "Latest debug build — install directly on your phone."
          files: app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
