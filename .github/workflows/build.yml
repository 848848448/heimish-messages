name: Build APK

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - '*.gradle*'
      - 'gradle/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
      - run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Find APK
        id: apk
        run: |
          APK=$(find app/build -name "*.apk" -type f | head -1)
          echo "path=$APK" >> $GITHUB_OUTPUT
          ls -la "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: heimish-messages-v1.4
          path: ${{ steps.apk.outputs.path }}
          retention-days: 90

      - name: Create Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4-build${{ github.run_number }}
          name: "Heimish Messages v1.4"
          body: |
            📱 Heimish Messages v1.4

            Tap the APK file below to download and install.
          files: ${{ steps.apk.outputs.path }}
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
