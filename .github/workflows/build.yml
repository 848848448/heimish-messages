name: Build APK
on:
  push:
    branches: [ main ]
    paths: ['app/**', '*.gradle*', 'gradle/**']
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: heimish-messages-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
      - name: Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4-b${{ github.run_number }}
          name: "Heimish Messages v1.4 (build ${{ github.run_number }})"
          body: "📱 Tap **app-debug.apk** below to download and install."
          files: app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
