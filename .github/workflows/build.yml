name: Build APK
on:
  push:
    branches: [ main ]
    paths: ['app/**', '*.gradle*', 'gradle/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug
      - name: Upload
        run: |
          APK=$(find app/build -name "*.apk" | head -1)
          echo "Found: $APK"
          echo "APK=$APK" >> $GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: heimish-messages-apk
          path: ${{ env.APK }}
          retention-days: 90
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4-b${{ github.run_number }}
          name: "Heimish Messages v1.4"
          body: "📱 Tap the APK file below to download."
          files: ${{ env.APK }}
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
