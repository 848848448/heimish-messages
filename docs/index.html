<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Heimish Messages</title>
<style>
:root{
  --teal:#128C7E;--teal-dark:#0d6e62;--green:#25D366;--green-dark:#1da851;
  --bg:#ECE5DD;--list-bg:#F0F2F5;--white:#fff;
  --bin:#fff;--bout:#DCF8C6;
  --text:#111B21;--meta:#667781;--div:#E9EDEF;
  --blue:#1a73e8;--blue-lt:#e8f0fe;
  --red:#d93025;--red-lt:#fce8e6;
  --sys:#54656f;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
html,body{height:100%;overflow:hidden}
body{background:var(--list-bg)}

/* ── SCREENS ── */
.screen{position:fixed;inset:0;display:flex;flex-direction:column;transition:transform .28s cubic-bezier(.4,0,.2,1);background:var(--list-bg)}
.screen.off-right{transform:translateX(100%)}
.screen.off-left{transform:translateX(-30%);pointer-events:none}

/* ── TOP BAR ── */
.tb{background:var(--teal);color:#fff;height:58px;display:flex;align-items:center;padding:0 4px;gap:2px;flex-shrink:0;position:relative}
.tb h1{font-size:19px;font-weight:700;flex:1;padding:0 6px}
.tb h2{font-size:17px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.tb-sub{font-size:11.5px;opacity:.8;margin-top:1px}
.tb-info{flex:1;min-width:0;padding:0 4px}
.tb-info h2{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ico-btn{background:none;border:none;color:#fff;cursor:pointer;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s}
.ico-btn:hover,.ico-btn:active{background:rgba(255,255,255,.18)}
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;flex-shrink:0;font-size:16px;cursor:pointer}

/* ── SEARCH BAR ── */
#sbar{background:var(--teal);padding:0 12px 10px;display:none}
#sbar input{width:100%;padding:9px 16px 9px 40px;border-radius:24px;border:none;background:rgba(255,255,255,.2);color:#fff;font-size:14px;outline:none}
#sbar input::placeholder{color:rgba(255,255,255,.7)}
.sbar-wrap{position:relative}
.sbar-ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.7}

/* ── CONV LIST ── */
#conv-list{flex:1;overflow-y:auto;background:#fff}
.ci{display:flex;align-items:center;padding:10px 16px;gap:13px;cursor:pointer;border-bottom:.5px solid var(--div);min-height:72px;transition:background .12s;position:relative}
.ci:active{background:var(--list-bg)}
.ci-info{flex:1;min-width:0}
.ci-name{font-size:16px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci-name.u{font-weight:700}
.ci-snip{font-size:14px;color:var(--meta);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.ci-snip.u{color:var(--text);font-weight:500}
.ci-meta{text-align:right;flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.ci-time{font-size:12px;color:var(--meta)}
.ci-time.u{color:var(--green-dark);font-weight:600}
.badge{background:var(--green-dark);color:#fff;border-radius:50%;min-width:20px;height:20px;padding:0 5px;font-size:11px;display:flex;align-items:center;justify-content:center;font-weight:700}

/* swipe-to-archive */
.ci-swipe{position:absolute;right:0;top:0;bottom:0;background:#667781;display:flex;align-items:center;padding:0 20px;color:#fff;font-size:13px;gap:6px;transform:translateX(100%);transition:transform .2s;border-radius:0}

/* FAB */
#fab{position:fixed;bottom:24px;right:18px;width:58px;height:58px;background:var(--green);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.28);z-index:20;border:none;transition:transform .18s,box-shadow .18s}
#fab:active{transform:scale(.93);box-shadow:0 2px 8px rgba(0,0,0,.28)}

/* ── CHAT ── */
#chat{background:var(--bg)}
.chat-bg{flex:1;overflow-y:auto;padding:8px 8px 4px;display:flex;flex-direction:column;gap:0;
  background-image:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23b8aca0' fill-opacity='0.12' fill-rule='evenodd'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/svg%3E")}

/* day header */
.dh{text-align:center;margin:10px 0 6px;display:flex;align-items:center;justify-content:center}
.dh span{background:rgba(255,255,255,.9);padding:4px 14px;border-radius:10px;font-size:12px;color:var(--sys);font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.1)}

/* system msg */
.sysmsg{text-align:center;margin:6px 16px;font-size:12.5px;color:var(--sys)}

/* bubbles */
.brow{display:flex;margin:1px 0;align-items:flex-end;gap:4px}
.brow.in{padding-right:52px}
.brow.out{flex-direction:row-reverse;padding-left:52px}
.bubble{border-radius:12px;box-shadow:0 1px 2px rgba(0,0,0,.13);overflow:hidden;max-width:100%;position:relative}
.bubble.in{background:var(--bin);border-top-left-radius:2px}
.bubble.out{background:var(--bout);border-top-right-radius:2px}
.bubble img,.bubble video{width:100%;max-width:280px;display:block;border-radius:0;cursor:pointer}
.bubble video{max-height:220px;object-fit:cover}
.btext{font-size:15px;color:var(--text);line-height:1.45;word-break:break-word;white-space:pre-wrap;padding:7px 12px 2px}
.btext:first-child{padding-top:8px}
.bfooter{display:flex;align-items:center;justify-content:flex-end;gap:3px;padding:2px 9px 6px}
.btime{font-size:11px;color:var(--meta)}
.btick{color:#53BDEB;display:flex;align-items:center}
/* audio bubble */
.audio-bubble{display:flex;align-items:center;gap:10px;padding:10px 12px;min-width:200px}
.play-btn{width:42px;height:42px;border-radius:50%;background:var(--teal);border:none;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.audio-wave{flex:1;height:3px;background:rgba(0,0,0,.15);border-radius:2px;position:relative;cursor:pointer}
.audio-progress{height:100%;background:var(--teal);border-radius:2px;width:0%;transition:width .1s}
.audio-dot{width:12px;height:12px;border-radius:50%;background:var(--teal);position:absolute;top:-4.5px;left:0%;transform:translateX(-50%)}
.audio-dur{font-size:12px;color:var(--meta);min-width:34px;text-align:right}

/* reaction chip */
.reactions{display:flex;gap:3px;flex-wrap:wrap;padding:2px 8px 6px}
.rxn{background:rgba(0,0,0,.06);border-radius:20px;padding:2px 7px;font-size:13px;cursor:pointer;border:1px solid transparent;transition:border-color .15s}
.rxn:hover{border-color:var(--teal)}

/* reply quote */
.reply-quote{border-left:3px solid var(--teal);margin:6px 10px 0;padding:4px 8px;background:rgba(0,0,0,.04);border-radius:4px;font-size:13px;color:var(--meta);cursor:pointer}
.reply-quote b{color:var(--teal);display:block;font-size:12px;margin-bottom:2px}

/* ── COMPOSE ── */
.compose{background:var(--list-bg);padding:8px 8px 12px;display:flex;align-items:flex-end;gap:6px;flex-shrink:0}
.compose-inp{flex:1;background:#fff;border:none;border-radius:24px;padding:10px 16px;font-size:15.5px;outline:none;font-family:inherit;resize:none;max-height:130px;line-height:1.4;color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.compose-inp::placeholder{color:#aaa}
.send-btn{background:var(--teal);color:#fff;border:none;border-radius:50%;width:46px;height:46px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:background .18s,transform .12s;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.send-btn:active{transform:scale(.92)}
.send-btn.ready{background:var(--green)}

/* img preview strip */
#img-prev{display:none;background:var(--list-bg);padding:8px 12px;gap:8px;align-items:center;border-top:1px solid var(--div)}
#img-prev img{height:68px;width:68px;object-fit:cover;border-radius:10px}
#img-prev .rm{background:rgba(0,0,0,.55);color:#fff;border:none;border-radius:50%;width:22px;height:22px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;margin-left:-22px;margin-top:-60px;align-self:flex-start}

/* reply bar */
#reply-bar{display:none;background:var(--list-bg);padding:8px 12px;border-top:1px solid var(--div);gap:8px;align-items:center}
#reply-bar .rq{flex:1;border-left:3px solid var(--teal);padding:4px 8px;background:#fff;border-radius:4px;font-size:13px;color:var(--meta)}
#reply-bar .rq b{color:var(--teal);display:block;font-size:12px}

/* ── EMOJI PICKER ── */
#emoji-panel{display:none;background:#fff;border-top:1px solid var(--div);flex-direction:column;max-height:280px}
.emoji-tabs{display:flex;border-bottom:1px solid var(--div)}
.etab{flex:1;padding:10px;border:none;background:none;cursor:pointer;font-size:13px;font-weight:600;color:var(--meta);border-bottom:2px solid transparent;transition:color .15s,border-color .15s}
.etab.on{color:var(--blue);border-bottom-color:var(--blue)}
#emoji-search{padding:8px 12px;border-bottom:1px solid var(--div)}
#emoji-search input{width:100%;padding:7px 14px;border-radius:20px;border:1px solid var(--div);font-size:13px;outline:none;background:var(--list-bg)}
.emoji-grid{flex:1;overflow-y:auto;padding:8px;display:flex;flex-wrap:wrap;gap:2px}
.eg{width:38px;height:38px;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;border-radius:8px;transition:background .1s}
.eg:hover{background:var(--list-bg)}

/* ── ATTACH SHEET ── */
#attach-sheet{position:fixed;inset:0;z-index:100;display:none}
#attach-bg{position:absolute;inset:0;background:rgba(0,0,0,.45)}
#attach-box{position:absolute;bottom:0;left:0;right:0;background:#fff;border-radius:20px 20px 0 0;padding:20px 16px 32px}
.attach-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:16px}
.ach{display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer}
.ach-ico{width:54px;height:54px;border-radius:50%;background:var(--list-bg);display:flex;align-items:center;justify-content:center;transition:background .15s}
.ach:active .ach-ico{background:var(--div)}
.ach span{font-size:12px;color:var(--text)}

/* ── CTX MENU ── */
#ctx{position:fixed;z-index:200;background:#fff;border-radius:14px;box-shadow:0 8px 32px rgba(0,0,0,.22);padding:6px 0;min-width:180px;display:none;animation:popIn .18s ease}
@keyframes popIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
.ctx-item{display:flex;align-items:center;gap:12px;padding:12px 18px;cursor:pointer;font-size:14.5px;color:var(--text);transition:background .12s}
.ctx-item:hover{background:var(--list-bg)}
.ctx-item.danger{color:var(--red)}
.ctx-sep{height:.5px;background:var(--div);margin:4px 0}

/* ── OVERFLOW MENU ── */
#overflow{position:fixed;z-index:200;background:#fff;border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.18);padding:6px 0;min-width:210px;display:none;animation:popIn .18s ease;top:54px;right:8px}
.ov-item{display:flex;align-items:center;gap:12px;padding:13px 18px;cursor:pointer;font-size:15px;color:var(--text);transition:background .12s}
.ov-item:hover{background:var(--list-bg)}
.ov-item.danger{color:var(--red)}
.ov-sep{height:.5px;background:var(--div);margin:4px 0}

/* ── DETAILS SHEET ── */
#details{position:fixed;inset:0;z-index:150;display:none;flex-direction:column;background:#fff}
#details .dtb{background:#fff;color:var(--text);height:58px;display:flex;align-items:center;padding:0 4px;gap:4px;border-bottom:1px solid var(--div)}
#details .dtb h2{font-size:18px;font-weight:600;flex:1;padding-left:4px;color:var(--text)}
.det-hero{display:flex;flex-direction:column;align-items:center;padding:28px 16px 20px;background:var(--list-bg)}
.det-hero .dav{width:80px;height:80px;border-radius:50%;font-size:30px;margin-bottom:10px}
.det-hero h2{font-size:20px;font-weight:600;color:var(--text)}
.det-hero p{font-size:14px;color:var(--meta);margin-top:3px}
.det-actions{display:flex;gap:0;border-bottom:1px solid var(--div)}
.det-act{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 8px;cursor:pointer;transition:background .12s;border:none;background:none}
.det-act:hover{background:var(--list-bg)}
.det-act-ico{width:48px;height:48px;border-radius:50%;background:var(--blue-lt);display:flex;align-items:center;justify-content:center}
.det-act span{font-size:12px;color:var(--blue)}
.det-row{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:.5px solid var(--div);cursor:pointer;transition:background .12s}
.det-row:hover{background:var(--list-bg)}
.det-row-ico{color:var(--meta)}
.det-row-txt{flex:1}
.det-row-txt h3{font-size:15px;color:var(--text)}
.det-row-txt p{font-size:13px;color:var(--meta);margin-top:2px}
.det-row.danger h3{color:var(--red)}
.det-row.danger .det-row-ico{color:var(--red)}
.det-imgs{padding:12px 16px}
.det-imgs h3{font-size:14px;font-weight:600;color:var(--meta);margin-bottom:10px;display:flex;justify-content:space-between}
.det-imgs h3 span{color:var(--blue);font-weight:500;cursor:pointer}
.img-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.img-grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:4px;cursor:pointer}

/* ── SETTINGS ── */
#settings{position:fixed;inset:0;z-index:150;display:none;flex-direction:column;background:var(--list-bg)}
.settings-list{flex:1;overflow-y:auto}
.set-section{background:#fff;margin-bottom:8px}
.set-row{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:.5px solid var(--div);cursor:pointer;transition:background .12s}
.set-row:last-child{border-bottom:none}
.set-row:hover{background:var(--list-bg)}
.set-row-ico{color:var(--meta);width:24px;display:flex;justify-content:center}
.set-row-txt{flex:1}
.set-row-txt h3{font-size:15px;color:var(--text)}
.set-row-txt p{font-size:13px;color:var(--meta);margin-top:1px}
.toggle{width:42px;height:24px;border-radius:12px;background:var(--green);position:relative;cursor:pointer;flex-shrink:0;transition:background .2s}
.toggle::after{content:'';position:absolute;width:20px;height:20px;border-radius:50%;background:#fff;top:2px;right:2px;transition:right .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.toggle.off{background:#ccc}
.toggle.off::after{right:20px}

/* ── WARN CARD ── */
.warn-card{margin:8px 12px;background:#fff;border-radius:12px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.warn-card-hdr{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.warn-card-hdr svg{flex-shrink:0}
.warn-card-hdr b{font-size:15px;color:var(--text)}
.warn-card ul{list-style:none;padding:0 0 0 4px;margin-bottom:12px}
.warn-card ul li{font-size:13.5px;color:var(--meta);margin-bottom:4px}
.warn-card ul li::before{content:'• ';color:var(--meta)}
.warn-btns{display:flex;gap:8px}
.warn-btn{flex:1;padding:10px;border-radius:24px;border:none;font-size:14px;font-weight:600;cursor:pointer;transition:background .15s}
.warn-btn.spam{background:var(--red-lt);color:var(--red)}
.warn-btn.stay{background:var(--blue-lt);color:var(--blue)}

/* ── LIGHTBOX ── */
#lightbox{position:fixed;inset:0;background:#000;z-index:300;display:none;flex-direction:column}
#lightbox img,#lightbox video{flex:1;object-fit:contain;width:100%}
#lightbox-close{position:absolute;top:12px;right:12px;background:rgba(0,0,0,.5);border:none;color:#fff;border-radius:50%;width:40px;height:40px;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center}

/* ── TOAST ── */
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.78);color:#fff;padding:10px 20px;border-radius:24px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:400;white-space:nowrap}
#toast.show{opacity:1}

/* scrollbar */
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:rgba(0,0,0,.15);border-radius:3px}
</style>
</head>
<body>

<!-- LIST SCREEN -->
<div class="screen" id="list-scr">
  <div class="tb">
    <span style="font-size:22px;padding:0 6px">💬</span>
    <h1>Heimish Messages</h1>
    <button class="ico-btn" onclick="toggleSearch()" title="Search">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
    </button>
    <button class="ico-btn" onclick="showMenu('list')" title="More">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
    </button>
  </div>
  <div id="sbar">
    <div class="sbar-wrap">
      <svg class="sbar-ico" width="16" height="16" viewBox="0 0 24 24" fill="rgba(255,255,255,.7)"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      <input type="text" id="sinp" placeholder="Search…" oninput="filterC(this.value)">
    </div>
  </div>
  <div id="conv-list"></div>
  <button id="fab" onclick="toast('New conversation — coming soon!')">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="#fff"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-2 12H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z"/></svg>
  </button>
</div>

<!-- CHAT SCREEN -->
<div class="screen off-right" id="chat-scr">
  <div class="tb" id="chat-tb"></div>
  <div class="chat-bg" id="chat-bg"></div>
  <div id="reply-bar">
    <div class="rq" id="reply-quote-txt"></div>
    <button class="ico-btn" style="color:var(--meta)" onclick="clearReply()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
    </button>
  </div>
  <div id="img-prev">
    <img id="prev-img" src="">
    <button class="rm" onclick="clearImg()">✕</button>
  </div>
  <div id="emoji-panel">
    <div class="emoji-tabs">
      <button class="etab on" onclick="setETab('emoji',this)">😊 Emoji</button>
      <button class="etab" onclick="setETab('gif',this)">GIF</button>
      <button class="etab" onclick="setETab('sticker',this)">Sticker</button>
    </div>
    <div id="emoji-search"><input type="text" placeholder="Search emoji…" oninput="searchEmoji(this.value)"></div>
    <div class="emoji-grid" id="emoji-grid"></div>
  </div>
  <div class="compose">
    <input type="file" id="finp" accept="image/*,video/*" style="display:none" onchange="handleFile(this)">
    <button class="ico-btn" style="color:var(--meta);width:40px;height:40px" onclick="toggleAttach()">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm5 11h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
    </button>
    <textarea class="compose-inp" id="cinp" placeholder="Text message" rows="1"
      oninput="onType(this)" onkeydown="onKey(event)"></textarea>
    <button class="ico-btn" style="color:var(--meta);width:40px;height:40px" onclick="toggleEmoji()">

<script>
// ── COLOURS ───────────────────────────────────────────────────────────────────
const PAL=['#1F6F5C','#2E5E8C','#8C4A2E','#6A2E8C','#8C2E5E','#2E8C7A','#8C7A2E','#1A237E'];
const avc=s=>{let h=0;for(const c of(s||''))h=(h*31+c.charCodeAt(0))>>>0;return PAL[h%PAL.length]};
const ini=s=>((s||'?').trim()[0]||'?').toUpperCase();
const esc=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

// ── TIME ──────────────────────────────────────────────────────────────────────
const fmt=(ms,mode)=>{
  if(!ms)return'';
  const d=new Date(ms),n=new Date();
  const sameDay=d.toDateString()===n.toDateString();
  const yest=new Date(n);yest.setDate(yest.getDate()-1);
  const isYest=d.toDateString()===yest.toDateString();
  if(mode==='list'){if(sameDay)return d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});if(isYest)return'Yesterday';return d.toLocaleDateString([],{month:'short',day:'numeric'});}
  if(mode==='msg')return d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
  if(mode==='day'){if(sameDay)return'Today';if(isYest)return'Yesterday';return d.toLocaleDateString([],{weekday:'long',month:'long',day:'numeric'});}
  return'';
};
const fmtDayTime=ms=>`${fmt(ms,'day')} • ${fmt(ms,'msg')}`;

// ── DATA ──────────────────────────────────────────────────────────────────────
const convs=[
  {id:1,name:'אברהם פֿאַלאַטשעק',addr:'+13475551234',snip:'Hey, wie geits?',date:Date.now()-2*60000,unread:2,photo:null},

  {id:3,name:'ליפֿא מאַרק',addr:'+18455378946',snip:'Working SMS ✓',date:Date.now()-86400000,unread:0,photo:'https://i.pravatar.cc/80?img=12'},
  {id:4,name:'22000',addr:'22000',snip:'Your verification code is 847291',date:Date.now()-2*86400000,unread:0,photo:null},
  {id:5,name:'מענדל גרין',addr:'+13475557777',snip:'קומ שוין!',date:Date.now()-3*86400000,unread:2,photo:null},
  {id:6,name:'H 4, H1, H2, V4H 6...',addr:'group',snip:'📷 MMS Photo',date:Date.now()-4*86400000,unread:0,photo:null,group:true},
];
const msgs={
  1:[
    {id:1,body:'Hey!',date:Date.now()-86400000*2,in:true},
    {id:2,body:'Hey!',date:Date.now()-86400000*2+60000,in:false},
    {id:3,body:'וואס מאכסטו?',date:Date.now()-86400000+1000,in:true},
    {id:4,body:'ב"ה, ווי ביסטו?',date:Date.now()-86400000+120000,in:false},
    {id:5,body:'Hey, wie geits?',date:Date.now()-2*60000,in:true},
  ],
  2:[
    {id:6,body:'שלום!',date:Date.now()-3*86400000,in:false},
    {id:7,body:'שלום, ווי גייט?',date:Date.now()-3*86400000+5000,in:true},
    {id:8,body:'ב"ה גוט',date:Date.now()-3*86400000+60000,in:false},
    {id:9,body:'וואס גייט פאר',date:Date.now()-16*60000,in:true},
  ],
  3:[
    {id:10,body:'טעסט מעסעדזש',date:Date.now()-86400000*5,in:false},
    {id:11,body:'Working SMS ✓',date:Date.now()-86400000,in:true},
    {id:12,body:'',date:Date.now()-86400000+500,in:false,img:'https://picsum.photos/seed/mms1/300/200'},
    {id:13,body:'',date:Date.now()-3600000,in:true,audio:true,dur:'0:08'},
  ],
  4:[{id:14,body:'<#> Your verification code is 847291. Do not share this code with anyone.',date:Date.now()-2*86400000,in:true}],
  5:[
    {id:15,body:'וואו ביסטו?',date:Date.now()-3*86400000-60000,in:true},
    {id:16,body:'קומ שוין!',date:Date.now()-3*86400000,in:true},
  ],
  6:[
    {id:17,sys:'You created this group MMS with (347) 675-7590 and 18 others',date:Date.now()-4*86400000},
    {id:18,body:'',date:Date.now()-4*86400000+1000,in:true,img:'https://picsum.photos/seed/grp1/300/180',warn:true},
  ],
};

let activeId=null,replyTo=null,pendingImg=null,pendingVid=null,emojiOpen=false;

// ── LIST ──────────────────────────────────────────────────────────────────────
function renderList(list){
  const el=document.getElementById('conv-list');
  el.innerHTML=list.map(c=>`
    <div class="ci" onclick="openChat(${c.id})" id="ci-${c.id}">
      ${c.group
        ?`<div class="av" style="width:50px;height:50px;background:${avc(c.addr)};font-size:13px;flex-shrink:0">👥</div>`
        :c.photo
          ?`<img src="${c.photo}" class="av" style="width:50px;height:50px;object-fit:cover">`
          :`<div class="av" style="width:50px;height:50px;background:${avc(c.addr)};font-size:20px">${ini(c.name)}</div>`
      }
      <div class="ci-info">
        <div class="ci-name${c.unread?' u':''}">${esc(c.name)}</div>
        <div class="ci-snip${c.unread?' u':''}">${esc(c.snip)}</div>
      </div>
      <div class="ci-meta">
        <div class="ci-time${c.unread?' u':''}">${fmt(c.date,'list')}</div>
        ${c.unread?`<div class="badge">${c.unread}</div>`:''}
      </div>
    </div>
  `).join('');
}
function filterC(q){const f=q.trim().toLowerCase();renderList(f?convs.filter(c=>c.name.toLowerCase().includes(f)||c.snip.toLowerCase().includes(f)):convs);}
function toggleSearch(){const sb=document.getElementById('sbar');const on=sb.style.display!=='block';sb.style.display=on?'block':'none';if(on)document.getElementById('sinp').focus();else{document.getElementById('sinp').value='';renderList(convs);}}

// ── CHAT ──────────────────────────────────────────────────────────────────────
function openChat(id){
  activeId=id;
  const c=convs.find(x=>x.id===id);
  c.unread=0;
  renderList(convs);
  // slide in
  document.getElementById('list-scr').classList.add('off-left');
  document.getElementById('chat-scr').classList.remove('off-right');

  // topbar
  const av=c.photo
    ?`<img src="${c.photo}" class="av" style="width:38px;height:38px;object-fit:cover;cursor:pointer" onclick="showDetails(${id})">`
    :c.group
      ?`<div class="av" style="width:38px;height:38px;background:${avc(c.addr)};font-size:14px;cursor:pointer" onclick="showDetails(${id})">👥</div>`
      :`<div class="av" style="width:38px;height:38px;background:${avc(c.addr)};font-size:14px;cursor:pointer" onclick="showDetails(${id})">${ini(c.name)}</div>`;

  document.getElementById('chat-tb').innerHTML=`
    <button class="ico-btn" onclick="backToList()">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
    </button>
    ${av}
    <div class="tb-info" onclick="showDetails(${id})" style="cursor:pointer">
      <h2>${esc(c.name)}</h2>
      <div class="tb-sub">${c.group?'Tap for group info':esc(c.addr)}</div>
    </div>
    ${!c.group ? `<button class="ico-btn" onclick="window.open('tel:${c.addr}')">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1-9.4 0-17-7.6-17-17 0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1L6.6 10.8z"/></svg>
    </button>` : ''}
    <button class="ico-btn" onclick="showMenu('chat')">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
    </button>
  `;
  renderMsgs(id);
  document.getElementById('cinp').focus();
}

function backToList(){
  document.getElementById('list-scr').classList.remove('off-left');
  document.getElementById('chat-scr').classList.add('off-right');
  activeId=null;clearReply();clearImg();closeEmoji();closeOverflow();
}

function renderMsgs(id){
  const list=msgs[id]||[];
  let lastDay='',html='';
  const hasWarn=list.some(m=>m.warn);

  for(const m of list){
    // system message
    if(m.sys){html+=`<div class="sysmsg">${esc(m.sys)}</div>`;continue;}
    // warn card
    if(m.warn && hasWarn){
      html+=`<div class="warn-card">
        <div class="warn-card-hdr">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="#FF9800"><path d="M12 2L1 21h22L12 2zm0 3.5L20.5 19h-17L12 5.5zm-1 5.5v4h2v-4h-2zm0 6v2h2v-2h-2z"/></svg>
          <b>Unknown sender added you</b>
        </div>
        <ul>
          <li>(845) 717-9201 (United States)</li>
          <li>19 other people in this group</li>
          <li>7 in contacts</li>
        </ul>
        <div class="warn-btns">
          <button class="warn-btn spam" onclick="toast('Reported as spam')">Report spam</button>
          <button class="warn-btn stay" onclick="this.closest('.warn-card').remove();toast('Staying in group')">Stay in group</button>
        </div>
      </div>`;
    }

    const day=fmt(m.date,'day');
    if(day!==lastDay){html+=`<div class="dh"><span>${day}</span></div>`;lastDay=day;}

    // reply quote
    const rq=m.replyTo?`<div class="reply-quote"><b>${esc(m.replyTo.from)}</b>${esc(m.replyTo.text)}</div>`:'';

    let inner='';
    if(m.img)inner+=`<img src="${m.img}" alt="MMS" onclick="openLightbox('img','${m.img}')" onerror="this.style.display='none'">`;
    if(m.audio)inner+=audioBubble(m);
    if(m.body)inner+=`<div class="btext">${esc(m.body)}</div>`;

    const foot=`<div class="bfooter">
      <span class="btime">${fmt(m.date,'msg')}</span>
      ${!m.in?`<span class="btick"><svg width="16" height="11" viewBox="0 0 16 11" fill="#53BDEB"><path d="M11.071.653a.75.75 0 0 1 1.06 1.061L5.94 8.005a.75.75 0 0 1-1.006.055L1.22 5.088a.75.75 0 1 1 .937-1.173l3.2 2.554 5.714-5.816z"/><path d="M14.87.653a.75.75 0 0 1 1.06 1.061L9.74 8.005a.75.75 0 0 1-1.005.055L5.022 5.088a.75.75 0 1 1 .937-1.173l3.2 2.554L14.87.653z"/></svg></span>`:''}
    </div>`;

    html+=`<div class="brow ${m.in?'in':'out'}" data-id="${m.id}" oncontextmenu="showCtx(event,${m.id})" ontouchstart="startLongPress(event,${m.id})" ontouchend="endLongPress()">
      <div class="bubble ${m.in?'in':'out'}">${rq}${inner}${foot}</div>
    </div>`;
  }

  if(!html)html=`<div style="flex:1;display:flex;align-items:center;justify-content:center;color:var(--meta);font-size:14px">No messages yet</div>`;
  const bg=document.getElementById('chat-bg');
  bg.innerHTML=html;
  bg.scrollTop=bg.scrollHeight;
}

function audioBubble(m){
  return`<div class="audio-bubble">
    <button class="play-btn" onclick="playAudio(this)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <div class="audio-wave"><div class="audio-progress" id="ap-${m.id}"></div><div class="audio-dot" id="ad-${m.id}"></div></div>
    <span class="audio-dur">${m.dur||'0:00'}</span>
  </div>`;
}
function playAudio(btn){toast('Audio playback — coming in APK');}

// ── SEND ──────────────────────────────────────────────────────────────────────
function onType(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,130)+'px';document.getElementById('sbtn').className='send-btn'+(el.value.trim()||pendingImg||pendingVid?' ready':'');}
function onKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();}}

function sendMsg(){
  const inp=document.getElementById('cinp');
  const body=inp.value.trim();
  if(!body&&!pendingImg&&!pendingVid)return;
  const m={id:Date.now(),body,date:Date.now(),in:false};
  if(pendingImg)m.img=pendingImg;
  if(pendingVid)m.vid=pendingVid;
  if(replyTo)m.replyTo=replyTo;
  if(!msgs[activeId])msgs[activeId]=[];
  msgs[activeId].push(m);
  const c=convs.find(x=>x.id===activeId);
  if(c){c.snip=body||(pendingImg?'📷 Photo':pendingVid?'🎥 Video':'');c.date=m.date;}
  inp.value='';inp.style.height='auto';
  clearImg();clearReply();closeEmoji();
  document.getElementById('sbtn').className='send-btn';
  renderMsgs(activeId);renderList(convs);
  // simulate reply
  setTimeout(()=>{
    const rs=['אָקעי!','👍','פֿאַרשטאַנען','יאָ, בסדר','שיין!','ב"ה','👌','😊'];
    const r={id:Date.now()+1,body:rs[Math.floor(Math.random()*rs.length)],date:Date.now(),in:true};
    msgs[activeId].push(r);const cv=convs.find(x=>x.id===activeId);if(cv){cv.snip=r.body;cv.date=r.date;}
    renderMsgs(activeId);renderList(convs);
  },1500);
}

// ── FILES ─────────────────────────────────────────────────────────────────────
function handleFile(inp){
  const f=inp.files[0];if(!f)return;
  const isVid=f.type.startsWith('video/');
  const reader=new FileReader();
  reader.onload=e=>{
    if(isVid){pendingVid=e.target.result;pendingImg=null;}
    else{pendingImg=e.target.result;pendingVid=null;}
    document.getElementById('prev-img').src=e.target.result;
    document.getElementById('img-prev').style.display='flex';
    document.getElementById('img-prev').style.alignItems='center';
    document.getElementById('img-prev').style.gap='8px';
    document.getElementById('sbtn').className='send-btn ready';
  };
  reader.readAsDataURL(f);inp.value='';
}
function clearImg(){pendingImg=null;pendingVid=null;document.getElementById('img-prev').style.display='none';document.getElementById('prev-img').src='';document.getElementById('sbtn').className='send-btn'+(document.getElementById('cinp').value.trim()?' ready':'');}

// ── REPLY ─────────────────────────────────────────────────────────────────────
function setReply(msgId){
  const m=(msgs[activeId]||[]).find(x=>x.id===msgId);if(!m)return;
  replyTo={from:m.in?(convs.find(x=>x.id===activeId)||{}).name||'Them':'You',text:m.body||'📷 Photo'};
  const rb=document.getElementById('reply-bar');
  document.getElementById('reply-quote-txt').innerHTML=`<b>${esc(replyTo.from)}</b>${esc(replyTo.text)}`;
  rb.style.display='flex';
  document.getElementById('cinp').focus();
  closeCtx();
}

// ── CTX MENU ──────────────────────────────────────────────────────────────────
let lpTimer=null;
function startLongPress(e,id){lpTimer=setTimeout(()=>showCtx(e,id),500);}
function endLongPress(){clearTimeout(lpTimer);}
function showCtx(e,id){
  e.preventDefault&&e.preventDefault();
  const m=(msgs[activeId]||[]).find(x=>x.id===id);if(!m)return;
  const ctx=document.getElementById('ctx');
  ctx.innerHTML=[
    ['↩️','Reply',()=>setReply(id)],
    ['📋','Copy',()=>{navigator.clipboard&&navigator.clipboard.writeText(m.body||'');toast('Copied')}],
    ['⭐','Star message',()=>toast('Starred ⭐')],
    ['🔁','Forward',()=>toast('Forward — coming soon!')],
    ['sep'],
    ['🗑️','Delete','danger',()=>{msgs[activeId]=(msgs[activeId]||[]).filter(x=>x.id!==id);renderMsgs(activeId);closeCtx();}],
  ].map(r=>{
    if(r[0]==='sep')return'<div class="ctx-sep"></div>';
    const isDanger=r[2]==='danger';
    const cb=isDanger?r[3]:r[2];
    return`<div class="ctx-item${isDanger?' danger':''}" onclick="(${cb})()">${r[0]} ${r[1]}</div>`;
  }).join('');
  ctx.style.display='block';
  const x=Math.min((e.clientX||e.touches?.[0]?.clientX||100),window.innerWidth-200);
  const y=Math.min((e.clientY||e.touches?.[0]?.clientY||100),window.innerHeight-220);
  ctx.style.left=x+'px';ctx.style.top=y+'px';
  setTimeout(()=>document.addEventListener('click',closeCtx,{once:true}),10);
}
function closeCtx(){document.getElementById('ctx').style.display='none';}

// ── OVERFLOW MENU ─────────────────────────────────────────────────────────────
function showMenu(mode){
  const ov=document.getElementById('overflow');
  let items=[];
  if(mode==='chat'){
    items=[
      ['Add people',()=>toast('Add people — group feature')],
      ['Details',()=>showDetails(activeId)],
      ['Starred',()=>toast('Starred messages — coming soon!')],
      ['Search',()=>toast('In-chat search — coming soon!')],
      ['Archive',()=>{backToList();toast('Archived');}],
      ['sep'],
      ['Video call',()=>toast('Video call — coming soon!')],
      ['Block & report spam',true,()=>toast('Blocked & reported')],
      ['Delete',true,()=>{if(confirm('Delete conversation?')){const i=convs.findIndex(x=>x.id===activeId);if(i>-1)convs.splice(i,1);delete msgs[activeId];backToList();renderList(convs);}}],
    ];
  } else {
    items=[
      ['Your profile',()=>toast('Profile — coming soon!')],
      ['Archived',()=>toast('Archived chats — coming soon!')],
      ['Spam & blocked',()=>toast('Spam & blocked — coming soon!')],
      ['Mark all as read',()=>{convs.forEach(c=>c.unread=0);renderList(convs);toast('All marked as read');}],
      ['sep'],
      ['Settings',()=>showSettings()],
      ['Help & feedback',()=>toast('Help — coming soon!')],
    ];
  }
  ov.innerHTML=items.map(it=>{
    if(it[0]==='sep')return'<div class="ov-sep"></div>';
    const isDanger=it[1]===true;
    const cb=isDanger?it[2]:it[1];
    return`<div class="ov-item${isDanger?' danger':''}" onclick="closeOverflow();(${cb})()">${it[0]}</div>`;
  }).join('');
  ov.style.display='block';
  setTimeout(()=>document.addEventListener('click',closeOverflow,{once:true}),10);
}
function closeOverflow(){document.getElementById('overflow').style.display='none';}

// ── SETTINGS ──────────────────────────────────────────────────────────────────
function showSettings(){
  const s=document.getElementById('settings');
  s.style.display='flex';

      <div class="tb"><button class="ico-btn" onclick="closeSettings()"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></button><h1>Settings</h1></div>
      <div class="settings-list">
        <div class="set-section">
          ${setRow('🔔','Notifications','Manage notification sounds & alerts')}
          ${setRow('💬','Bubbles','Control conversation bubbles')}
        </div>
        <div class="set-section">
          ${setRowToggle('📷','Send photos faster','Resolution is reduced for faster sending',true)}
          ${setRowToggle('🔊','Message sounds','Hear outgoing and incoming sounds',true)}
          ${setRowToggle('🔍','Pinch to zoom','Pinch to zoom conversation text',true)}
          ${setRowToggle('✨','Expressive animations','Show animated reactions',true)}

        <div class="set-section">
          ${setRow('🎨','Choose theme','System default')}
          ${setRow('🌍','Your country','Automatically detected (United States)')}

          ${setRow('🔗','Automatic previews','Show only web link previews')}
          ${setRow('🛡️','Protection & Safety','')}
          ${setRow('↔️','Swipe actions','Archive: swipe right / Archive: swipe left')}

function setRow(ico,title,sub){return`<div class="set-row" onclick="toast('${title}')"><div class="set-row-ico">${ico}</div><div class="set-row-txt"><h3>${title}</h3>${sub?`<p>${sub}</p>`:''}</div></div>`;}
function setRowToggle(ico,title,sub,on){return`<div class="set-row"><div class="set-row-ico">${ico}</div><div class="set-row-txt"><h3>${title}</h3>${sub?`<p>${sub}</p>`:''}</div><div class="toggle${on?'':' off'}" onclick="this.classList.toggle('off')"></div></div>`;}
function closeSettings(){document.getElementById('settings').style.display='none';}

// ── LIGHTBOX ──────────────────────────────────────────────────────────────────
function openLightbox(type,src){
  const lb=document.getElementById('lightbox');
  lb.style.display='flex';
  document.getElementById('lb-img').style.display=type==='img'?'block':'none';
  document.getElementById('lb-vid').style.display=type==='vid'?'block':'none';
  if(type==='img')document.getElementById('lb-img').src=src;
  else{document.getElementById('lb-vid').src=src;document.getElementById('lb-vid').play();}
}
function closeLightbox(){document.getElementById('lightbox').style.display='none';document.getElementById('lb-vid').pause();}

// ── TOAST ─────────────────────────────────────────────────────────────────────
let toastTimer;
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2800);}

// ── INIT ──────────────────────────────────────────────────────────────────────
renderList(convs);
document.addEventListener('click',e=>{if(!document.getElementById('ctx').contains(e.target))closeCtx();});
