<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Heimish Messages</title>
<style>
:root {
  --teal:    #128C7E;
  --green:   #25D366;
  --bg:      #ECE5DD;
  --list-bg: #F0F2F5;
  --white:   #FFFFFF;
  --bubble-in:  #FFFFFF;
  --bubble-out: #DCF8C6;
  --text:    #111B21;
  --meta:    #667781;
  --divider: #E9EDEF;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--list-bg);height:100dvh;display:flex;flex-direction:column;overflow:hidden}

/* ── Top bar ── */
.topbar{background:var(--teal);color:#fff;display:flex;align-items:center;padding:0 4px 0 8px;height:56px;flex-shrink:0;gap:4px}
.topbar-title{font-size:19px;font-weight:700;flex:1;padding-left:4px}
.topbar-sub{font-size:11px;opacity:.75;margin-top:1px}
.topbar-info{flex:1;min-width:0}
.topbar-info h2{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-btn{background:none;border:none;color:#fff;cursor:pointer;padding:10px;font-size:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;min-width:44px;min-height:44px}
.tb-btn:hover{background:rgba(255,255,255,.15)}
.tb-avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;color:#fff;flex-shrink:0}

/* ── Search bar ── */
#searchbar{background:var(--list-bg);padding:8px 12px;display:none}
#searchbar input{width:100%;padding:9px 16px;border-radius:22px;border:none;background:#fff;font-size:14px;outline:none;color:var(--text)}
#searchbar input::placeholder{color:#aaa}

/* ── Conv list ── */
#conv-list{flex:1;overflow-y:auto;background:#fff}
.conv-item{display:flex;align-items:center;padding:10px 16px;gap:13px;cursor:pointer;border-bottom:.5px solid var(--divider);transition:background .12s;min-height:72px}
.conv-item:active,.conv-item.active{background:var(--list-bg)}
.avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;flex-shrink:0}
.avatar-lg{width:50px;height:50px;font-size:20px}
.conv-info{flex:1;min-width:0}
.conv-name{font-weight:600;font-size:16px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv-snippet{font-size:14px;color:var(--meta);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.conv-name.unread{font-weight:700}
.conv-snippet.unread{color:var(--text);font-weight:500}
.conv-meta{text-align:right;flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.conv-time{font-size:12px;color:var(--meta)}
.conv-time.unread{color:var(--teal);font-weight:600}
.badge{background:var(--green);color:#fff;border-radius:50%;width:20px;height:20px;font-size:11px;display:flex;align-items:center;justify-content:center;font-weight:700}

/* ── FAB ── */
#fab{position:fixed;bottom:20px;right:16px;width:56px;height:56px;background:var(--green);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.3);font-size:26px;color:#fff;z-index:10;border:none;transition:transform .18s}
#fab:active{transform:scale(.94)}

/* ── Chat screen ── */
#chat-screen{display:none;flex-direction:column;height:100dvh;background:var(--bg)}
.chat-bg{flex:1;overflow-y:auto;padding:8px 8px 4px;display:flex;flex-direction:column;gap:1px;
  background-color:var(--bg);
  background-image:url("data:image/svg+xml,%3Csvg width='52' height='52' viewBox='0 0 52 52' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23b8aca0' fill-opacity='0.15'%3E%3Cpath d='M26 24v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-24V0h-2v4h-4v2h4v4h2V6h4V4h-4z'/%3E%3C/g%3E%3C/svg%3E")}

/* Day header */
.day-hdr{text-align:center;margin:10px 0 6px;display:flex;align-items:center;justify-content:center}
.day-hdr span{background:rgba(255,255,255,.88);padding:4px 14px;border-radius:10px;font-size:12px;color:#54656f;font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.1)}

/* Bubbles */
.brow{display:flex;margin:1px 0}
.brow.in{justify-content:flex-start;padding-right:60px}
.brow.out{justify-content:flex-end;padding-left:60px}
.bubble{padding:6px 10px 4px;border-radius:10px;box-shadow:0 1px 2px rgba(0,0,0,.13);max-width:100%;overflow:hidden}
.bubble.in{background:var(--bubble-in);border-top-left-radius:2px}
.bubble.out{background:var(--bubble-out);border-top-right-radius:2px}
.bubble img{width:100%;max-width:260px;border-radius:6px;display:block;margin-bottom:4px}
.btext{font-size:15px;color:var(--text);line-height:1.45;word-break:break-word;white-space:pre-wrap}
.bfooter{display:flex;align-items:center;justify-content:flex-end;gap:3px;margin-top:2px}
.btime{font-size:11px;color:var(--meta)}
.tick{color:#53BDEB;font-size:13px;line-height:1}

/* Compose */
.compose{background:var(--list-bg);padding:8px 8px 12px;display:flex;align-items:flex-end;gap:8px;flex-shrink:0}
.compose-attach{background:none;border:none;cursor:pointer;padding:10px;font-size:24px;color:var(--meta);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.compose-inp{flex:1;background:#fff;border:none;border-radius:24px;padding:10px 16px;font-size:15px;outline:none;font-family:inherit;resize:none;max-height:120px;line-height:1.4;color:var(--text)}
.compose-inp::placeholder{color:#aaa}
.send-btn{background:var(--teal);color:#fff;border:none;border-radius:50%;width:46px;height:46px;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .18s}
.send-btn:active{background:var(--green)}
.send-btn.ready{background:var(--green)}

/* Image preview before send */
#img-preview{display:none;background:var(--list-bg);padding:8px 16px;border-top:1px solid var(--divider)}
#img-preview img{height:72px;border-radius:8px;object-fit:cover}
#img-preview button{background:none;border:none;cursor:pointer;font-size:20px;color:var(--meta);padding:4px}

/* Empty state */
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--meta);gap:12px;padding:40px;text-align:center}
.empty svg{opacity:.25}

/* List screen */
#list-screen{display:flex;flex-direction:column;height:100dvh}

/* Scrollbar */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:rgba(0,0,0,.18);border-radius:4px}
</style>
</head>
<body>

<!-- LIST SCREEN -->
<div id="list-screen">
  <div class="topbar">
    <span style="font-size:22px;padding:0 6px">💬</span>
    <span class="topbar-title">Heimish Messages</span>
    <button class="tb-btn" onclick="toggleSearch()" title="Search">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
    </button>
  </div>
  <div id="searchbar">
    <input type="text" id="search-inp" placeholder="Search…" oninput="filterConvs(this.value)">
  </div>
  <div id="conv-list"></div>
  <button id="fab">✏️</button>
</div>

<!-- CHAT SCREEN -->
<div id="chat-screen">
  <div class="topbar" id="chat-topbar"></div>
  <div class="chat-bg" id="chat-bg"></div>
  <div id="img-preview">
    <img id="preview-img" src="">
    <button onclick="clearImg()">✕</button>
  </div>
  <div class="compose">
    <input type="file" id="file-inp" accept="image/*" style="display:none" onchange="handleImg(this)">
    <button class="compose-attach" onclick="document.getElementById('file-inp').click()">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
    </button>
    <textarea class="compose-inp" id="compose-inp" placeholder="Message…" rows="1"
      oninput="onType(this)" onkeydown="onKey(event)"></textarea>
    <button class="send-btn" id="send-btn" onclick="send()">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>
</div>

<script>
// ── Colours (match app exactly) ───────────────────────────────────────────────
const COLORS=['#1F6F5C','#2E5E8C','#8C4A2E','#6A2E8C','#8C2E5E','#2E8C7A','#8C7A2E','#1A237E'];
function avatarColor(s){let h=0;for(const c of(s||''))h=(h*31+c.charCodeAt(0))>>>0;return COLORS[h%COLORS.length]}
function initials(s){return((s||'?').trim()[0]||'?').toUpperCase()}
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

// ── Time helpers ──────────────────────────────────────────────────────────────
function shortTime(ms){
  if(!ms)return'';
  const d=new Date(ms),n=new Date();
  if(d.toDateString()===n.toDateString())return d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
  const y=new Date(n);y.setDate(y.getDate()-1);
  if(d.toDateString()===y.toDateString())return'Yesterday';
  return d.toLocaleDateString([],{month:'short',day:'numeric'});
}
function msgTime(ms){return ms?new Date(ms).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}):''}
function dayLabel(ms){
  if(!ms)return'';
  const d=new Date(ms),n=new Date();
  if(d.toDateString()===n.toDateString())return'Today';
  const y=new Date(n);y.setDate(y.getDate()-1);
  if(d.toDateString()===y.toDateString())return'Yesterday';
  return d.toLocaleDateString([],{month:'long',day:'numeric',year:'numeric'});
}

// ── Sample data (same names as screenshots) ───────────────────────────────────
const convs=[
  {id:1,name:'אברהם פֿאַלאַטשעק',addr:'+13475551234',snippet:'Hey, wie geits?',date:Date.now()-2*60000,unread:2},
  {id:2,name:"ישעי' מערץ",addr:'+13475559876',snippet:'וואס גייט פאר',date:Date.now()-16*60000,unread:0},
  {id:3,name:'ליפֿא מאַרק',addr:'+13475553333',snippet:'Working SMS ✓',date:Date.now()-86400000,unread:0},
  {id:4,name:'22000',addr:'22000',snippet:'Your verification code is 847291',date:Date.now()-2*86400000,unread:0},
  {id:5,name:'מענדל גרין',addr:'+13475557777',snippet:'קומ שוין!',date:Date.now()-3*86400000,unread:2},
];
const msgs={
  1:[
    {id:1,body:'Hey!',date:Date.now()-86400000*2,in:true},
    {id:2,body:'Hey!',date:Date.now()-86400000*2+60000,in:false},
    {id:3,body:'וואס מאכסטו?',date:Date.now()-86400000+1000,in:true},
    {id:4,body:'ב"ה, ווי ביסטו?',date:Date.now()-86400000+120000,in:false},
    {id:5,body:'Hey, wie geits?',date:Date.now()-2*60000,in:true},
  ],
  2:[
    {id:6,body:'שלום!',date:Date.now()-3*86400000,in:false},
    {id:7,body:'שלום, ווי גייט?',date:Date.now()-3*86400000+5000,in:true},
    {id:8,body:'ב"ה גוט',date:Date.now()-3*86400000+60000,in:false},
    {id:9,body:'וואס גייט פאר',date:Date.now()-16*60000,in:true},
  ],
  3:[
    {id:10,body:'טעסט מעסעדזש',date:Date.now()-86400000*5,in:false},
    {id:11,body:'Working SMS ✓',date:Date.now()-86400000,in:true},
    {id:12,body:'',date:Date.now()-86400000+500,in:false,img:'https://picsum.photos/seed/mms1/300/200'},
  ],
  4:[{id:13,body:'Your verification code is 847291. Do not share this with anyone.',date:Date.now()-2*86400000,in:true}],
  5:[
    {id:14,body:'וואו ביסטו?',date:Date.now()-3*86400000-60000,in:true},
    {id:15,body:'קומ שוין!',date:Date.now()-3*86400000,in:true},
  ],
};

let activeId=null, pendingImg=null;

// ── List ──────────────────────────────────────────────────────────────────────
function renderList(list){
  const el=document.getElementById('conv-list');
  if(!list.length){el.innerHTML='<div class="empty"><svg width="64" height="64" viewBox="0 0 24 24" fill="#667781"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg><p>No messages</p></div>';return}
  el.innerHTML=list.map(c=>`
    <div class="conv-item${activeId===c.id?' active':''}" onclick="openChat(${c.id})">
      <div class="avatar avatar-lg" style="background:${avatarColor(c.addr)}">${initials(c.name)}</div>
      <div class="conv-info">
        <div class="conv-name${c.unread?' unread':''}">${esc(c.name)}</div>
        <div class="conv-snippet${c.unread?' unread':''}">${esc(c.snippet)}</div>
      </div>
      <div class="conv-meta">
        <div class="conv-time${c.unread?' unread':''}">${shortTime(c.date)}</div>
        ${c.unread?`<div class="badge">${c.unread}</div>`:''}
      </div>
    </div>
  `).join('');
}

function filterConvs(q){
  const f=q.trim().toLowerCase();
  renderList(f?convs.filter(c=>c.name.toLowerCase().includes(f)||c.snippet.toLowerCase().includes(f)):convs);
}

function toggleSearch(){
  const sb=document.getElementById('searchbar');
  const show=sb.style.display!=='block';
  sb.style.display=show?'block':'none';
  if(show){document.getElementById('search-inp').focus();}
  else{document.getElementById('search-inp').value='';renderList(convs);}
}

// ── Chat ──────────────────────────────────────────────────────────────────────
function openChat(id){
  activeId=id;
  const conv=convs.find(c=>c.id===id);
  conv.unread=0;
  renderList(convs);
  document.getElementById('list-screen').style.display='none';
  const cs=document.getElementById('chat-screen');
  cs.style.display='flex';

  // topbar
  document.getElementById('chat-topbar').innerHTML=`
    <button class="tb-btn" onclick="backToList()">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
    </button>
    <div class="avatar tb-avatar" style="background:${avatarColor(conv.addr)}">${initials(conv.name)}</div>
    <div class="topbar-info">
      <h2>${esc(conv.name)}</h2>
      <span class="topbar-sub">${esc(conv.addr)}</span>
    </div>
    <button class="tb-btn" onclick="alert('Calling…')">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1-9.4 0-17-7.6-17-17 0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1L6.6 10.8z"/></svg>
    </button>
    <button class="tb-btn" onclick="deleteConv(${id})">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
    </button>
  `;

  renderMessages(id);
  document.getElementById('compose-inp').focus();
}

function renderMessages(id){
  const list=msgs[id]||[];
  let lastDay='',html='';
  for(const m of list){
    const day=dayLabel(m.date);
    if(day!==lastDay){html+=`<div class="day-hdr"><span>${day}</span></div>`;lastDay=day;}
    html+=`<div class="brow ${m.in?'in':'out'}">
      <div class="bubble ${m.in?'in':'out'}">
        ${m.img?`<img src="${m.img}" alt="MMS" onerror="this.style.display='none'">` :''}
        ${m.body?`<div class="btext">${esc(m.body)}</div>`:''}
        <div class="bfooter">
          <span class="btime">${msgTime(m.date)}</span>
          ${!m.in?'<span class="tick">✓✓</span>':''}
        </div>
      </div>
    </div>`;
  }
  if(!html)html='<div class="empty"><p style="color:var(--meta)">No messages yet</p></div>';
  const bg=document.getElementById('chat-bg');
  bg.innerHTML=html;
  bg.scrollTop=bg.scrollHeight;
}

function backToList(){
  activeId=null;
  document.getElementById('chat-screen').style.display='none';
  document.getElementById('list-screen').style.display='flex';
  clearImg();
}

function deleteConv(id){
  if(!confirm('Delete this conversation?'))return;
  const i=convs.findIndex(c=>c.id===id);
  if(i>-1)convs.splice(i,1);
  backToList();
  renderList(convs);
}

// ── Compose ───────────────────────────────────────────────────────────────────
function onType(el){
  el.style.height='auto';
  el.style.height=Math.min(el.scrollHeight,120)+'px';
  document.getElementById('send-btn').className='send-btn'+(el.value.trim()||pendingImg?' ready':'');
}
function onKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}}

function send(){
  const inp=document.getElementById('compose-inp');
  const body=inp.value.trim();
  if(!body&&!pendingImg)return;

  const m={id:Date.now(),body,date:Date.now(),in:false};
  if(pendingImg)m.img=pendingImg;

  if(!msgs[activeId])msgs[activeId]=[];
  msgs[activeId].push(m);
  const conv=convs.find(c=>c.id===activeId);
  if(conv){conv.snippet=body||(pendingImg?'📷 Photo':'');conv.date=m.date;}

  inp.value='';inp.style.height='auto';
  clearImg();
  document.getElementById('send-btn').className='send-btn';
  renderMessages(activeId);
  renderList(convs);

  // simulate reply
  setTimeout(()=>{
    const replies=['אָקעי!','👍','פֿאַרשטאַנען','יאָ','שיין!','ב"ה'];
    const r={id:Date.now()+1,body:replies[Math.floor(Math.random()*replies.length)],date:Date.now(),in:true};
    msgs[activeId].push(r);
    const cv=convs.find(c=>c.id===activeId);
    if(cv){cv.snippet=r.body;cv.date=r.date;}
    renderMessages(activeId);
    renderList(convs);
  },1500);
}

function handleImg(inp){
  const file=inp.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    pendingImg=e.target.result;
    document.getElementById('preview-img').src=pendingImg;
    document.getElementById('img-preview').style.display='flex';
    document.getElementById('img-preview').style.alignItems='center';
    document.getElementById('img-preview').style.gap='8px';
    document.getElementById('send-btn').className='send-btn ready';
  };
  reader.readAsDataURL(file);
  inp.value='';
}
function clearImg(){
  pendingImg=null;
  document.getElementById('img-preview').style.display='none';
  document.getElementById('preview-img').src='';
  document.getElementById('send-btn').className='send-btn'+(document.getElementById('compose-inp').value.trim()?' ready':'');
}

renderList(convs);
</script>
</body>
</html>
