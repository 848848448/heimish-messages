function grpSvg(sz){
  return '<svg width="'+sz+'" height="'+sz+'" viewBox="0 0 24 24" fill="#fff"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>';
}
function makeAv(c,w,oc){
  const style='width:'+w+'px;height:'+w+'px;'+(oc?'cursor:pointer;':'')+'flex-shrink:0;';
  if(c.photo) return '<img src="'+c.photo+'" class="av" style="'+style+'object-fit:cover"'+(oc?' onclick="'+oc+'"':'')+' onerror="this.remove()">';
  return '<div class="av" style="'+style+'background:'+avc(c.addr)+';font-size:'+Math.floor(w*(c.group?.4:.38))+'px"'+(oc?' onclick="'+oc+'"':'')+'>'+(c.group?grpSvg(Math.floor(w*.55)):ini(c.name))+'</div>';
}

function renderList(list){

  }).join('');
}

  renderMsgs(id);
}

function backToList(){

function renderMsgs(id){
  const list=allMsgs[id]||[];
  let lastDay='',html='';
  for(const m of list){
    if(m.sys){
      const day=fmtDay(m.date);
      if(day!==lastDay){html+='<div class="dh"><span>'+day+'</span></div>';lastDay=day;}
      html+='<div class="sys-msg">'+esc(m.sys)+'</div>';
      continue;
    }
    const day=fmtDay(m.date);
    if(day!==lastDay){html+='<div class="dh"><span>'+day+'</span></div>';lastDay=day;}
    if(m.warn)html+=warnCard();
    const rq=m.replyTo?'<div class="rq-in"><b>'+esc(m.replyTo.from)+'</b><span>'+esc(m.replyTo.text)+'</span></div>':'';
    let inner='';
    if(m.img)inner+='<img src="'+m.img+'" onclick="openLb(\''+m.img+'\')" onerror="this.style.display=\'none\'">';
    if(m.audio)inner+='<div class="abub"><button class="play" onclick="T(\'Audio - coming in APK\')"><svg width="20" height="20" viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg></button><div class="awave"><div class="aprog"></div></div><span class="adur">'+(m.dur||'0:00')+'</span></div>';
    if(m.body)inner+='<div class="btext">'+esc(m.body)+'</div>';
    const tick=m.in?'':'<svg width="16" height="11" viewBox="0 0 18 11" fill="#53BDEB"><path d="M17.394 1.557a.75.75 0 0 0-1.06-1.06L9.45 7.38 6.88 4.806a.75.75 0 1 0-1.06 1.06l3.103 3.103a.75.75 0 0 0 1.06 0l7.41-7.412zM13.311 1.557a.75.75 0 0 0-1.06-1.06l-3.972 3.97-1.237-1.236a.75.75 0 0 0-1.061 1.06l1.768 1.768a.75.75 0 0 0 1.06 0l4.502-4.502z"/></svg>';
    html+='<div class="brow '+(m.in?'in':'out')+'" data-id="'+m.id+'" oncontextmenu="showCtx(event,'+m.id+')" ontouchstart="lp0(event,'+m.id+')" ontouchend="lp1()"><div class="bubble '+(m.in?'in':'out')+'">'+rq+inner+'<div class="bfooter"><span class="btime">'+fmtMsg(m.date)+'</span>'+tick+'</div></div></div>';
  }
  if(!html)html='<div style="flex:1;display:flex;align-items:center;justify-content:center;padding:40px"><span style="color:var(--meta);font-size:14px">No messages yet</span></div>';
  const bg=document.getElementById('chat-bg');bg.innerHTML=html;bg.scrollTop=bg.scrollHeight;
}

function onType(el){
  el.style.height='auto';el.style.height=Math.min(el.scrollHeight,130)+'px';
  const has=el.value.trim()||pendImg;
  document.getElementById('sbtn').className='sbtn'+(has?' go':'');
  document.getElementById('sbtn-ico').setAttribute('d',has?SND_D:MIC_D);
}
function onKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();}}
function resetBtn(){document.getElementById('sbtn').className='sbtn';document.getElementById('sbtn-ico').setAttribute('d',MIC_D);}

function sendMsg(){
  const inp=document.getElementById('cinp'),body=inp.value.trim();
  if(!body&&!pendImg)return;
  const m={id:Date.now(),body:body,date:Date.now(),in:false};
  if(pendImg)m.img=pendImg;
  if(replyTo)m.replyTo=replyTo;
  if(!allMsgs[aid])allMsgs[aid]=[];
  allMsgs[aid].push(m);
  const c=convs.find(x=>x.id===aid);
  if(c){c.snip=body||(pendImg?'Photo':'');c.date=m.date;}
  inp.value='';inp.style.height='auto';clearImg();clearReply();closeEmoji();resetBtn();
  renderMsgs(aid);renderList(convs);
  setTimeout(()=>{
    const rs=['אָקעי!','👍','פֿאַרשטאַנען','יאָ!','שיין!','👌','😊'];
    const r={id:Date.now()+1,body:rs[Math.floor(Math.random()*rs.length)],date:Date.now(),in:true};
    allMsgs[aid].push(r);const cv=convs.find(x=>x.id===aid);
    if(cv){cv.snip=r.body;cv.date=r.date;}
    renderMsgs(aid);renderList(convs);
  },1500);
}

function pickFile(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{pendImg=e.target.result;document.getElementById('ipimg').src=e.target.result;const ip=document.getElementById('iprev');ip.style.cssText='display:flex;align-items:center;gap:8px';document.getElementById('sbtn').className='sbtn go';document.getElementById('sbtn-ico').setAttribute('d',SND_D);};r.readAsDataURL(f);inp.value='';}
function clearImg(){pendImg=null;document.getElementById('iprev').style.display='none';document.getElementById('ipimg').src='';resetBtn();}

function setReply(msgId){
  const m=(allMsgs[aid]||[]).find(x=>x.id===msgId);if(!m)return;
  const c=convs.find(x=>x.id===aid);
  replyTo={from:m.in?(c||{}).name||'Them':'You',text:m.body||'Photo'};
  document.querySelector('#rbar-txt b').textContent=replyTo.from;
  document.querySelector('#rbar-txt span').textContent=replyTo.text;
  document.getElementById('rbar').style.display='flex';
  closeCtx();
}

function lp0(e,id){lpT=setTimeout(()=>showCtx(e,id),480);}

function showCtx(e,id){
  e.preventDefault&&e.preventDefault();
  const m=(allMsgs[aid]||[]).find(x=>x.id===id);if(!m)return;
  const ROWS=[
    ['<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M10 9V5l-7 7 7 7v-4.1c5 0 8.5 1.6 11 5.1-1-5-4-10-11-11z"/></svg>','Reply',false,()=>setReply(id)],
    ['<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>','Copy',false,()=>{try{navigator.clipboard.writeText(m.body||'');}catch(x){}T('Copied');}],
    ['<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>','Star',false,()=>T('Starred')],
    'sep',
    ['<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>','Delete',true,()=>{allMsgs[aid]=(allMsgs[aid]||[]).filter(x=>x.id!==id);renderMsgs(aid);closeCtx();}],
  ];
  const ctx=document.getElementById('ctx');
  ctx.innerHTML=ROWS.map(r=>{
    if(r==='sep')return '<div class="ctx-sep"></div>';
    return '<div class="ci-m'+(r[2]?' red':'')+'" onclick="closeCtx();('+r[3]+')()">'+ r[0]+' '+r[1]+'</div>';
  }).join('');
  ctx.style.display='block';
  const cx=e.clientX||(e.touches?.[0]?.clientX||100);
  const cy=e.clientY||(e.touches?.[0]?.clientY||200);
  ctx.style.left=Math.min(cx,window.innerWidth-210)+'px';
  ctx.style.top=Math.min(cy,window.innerHeight-240)+'px';
  setTimeout(()=>document.addEventListener('click',closeCtx,{once:true}),10);
}
function closeCtx(){document.getElementById('ctx').style.display='none';}

function showOv(mode){
  const items=mode==='chat'?[
    {lb:'Add people',fn:()=>T('Add people')},
    {lb:'Details',fn:()=>showDet(aid)},
    {lb:'Starred',fn:()=>T('Starred messages')},
    {lb:'Search',fn:()=>T('Search in chat')},
    {lb:'Archive',fn:()=>{backToList();T('Archived');}},
    'sep',
    {lb:'Video call',fn:()=>T('Video call - coming in APK!')},
    {lb:'Block & report spam',red:true,fn:()=>T('Blocked')},
    {lb:'Delete',red:true,fn:()=>{if(confirm('Delete conversation?')){const i=convs.findIndex(x=>x.id===aid);if(i>-1)convs.splice(i,1);delete allMsgs[aid];backToList();renderList(convs);}}},
  ]:[
    {lb:'Your profile',fn:()=>T('Profile')},
    {lb:'Archived',fn:()=>T('Archived')},
    {lb:'Spam & blocked',fn:()=>T('Spam & blocked')},
    {lb:'Mark all as read',fn:()=>{convs.forEach(c=>c.unread=0);renderList(convs);T('All marked as read');}},
    'sep',
    {lb:'Settings',fn:()=>showSett()},
    {lb:'Help & feedback',fn:()=>T('Help')},
  ];
  const ov=document.getElementById('ov');
  ov.innerHTML=items.map(it=>it==='sep'?'<div class="ov-sep"></div>':`<div class="ov-i${it.red?' red':''}" onclick="closeOv();(${it.fn})()">${it.lb}</div>`).join('');
  ov.style.display='block';
  setTimeout(()=>document.addEventListener('click',closeOv,{once:true}),10);
}
function closeOv(){document.getElementById('ov').style.display='none';}

function showDet(id){
  const c=convs.find(x=>x.id===id);if(!c)return;
  const imgs=(allMsgs[id]||[]).filter(m=>m.img);
  const d=document.getElementById('det');d.style.display='flex';
  const av=makeAv(c,86);
  const callBtn=c.group?''
    :'<button class="da" onclick="T(\'Calling...\')">'
    +'<div class="da-ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="#1a73e8"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1-9.4 0-17-7.6-17-17 0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1L6.6 10.8z"/></svg></div>'
    +'<span>Call</span></button>';
  d.innerHTML='<div style="display:flex;flex-direction:column;height:100dvh">'
    +'<div class="det-tb"><button class="ib" style="color:var(--meta)" onclick="closeDet()"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></button>'
    +'<h2>'+(c.group?'Group info':'Contact info')+'</h2></div>'
    +'<div style="flex:1;overflow-y:auto">'
    +'<div class="det-hero">'+av+'<div class="det-name">'+esc(c.name)+'</div><div class="det-num">'+esc(c.addr)+'</div></div>'
    +'<div class="det-acts">'+callBtn
    +'<button class="da" onclick="T(\'Video call - coming in APK!\')"><div class="da-ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="#1a73e8"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg></div><span>Video</span></button>'
    +'<button class="da" onclick="T(\'Contact info\')"><div class="da-ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="#1a73e8"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg></div><span>Contact</span></button>'
    +'<button class="da" onclick="T(\'Search\')"><div class="da-ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="#1a73e8"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg></div><span>Search</span></button>'
    +'</div>'
    +(imgs.length?'<div class="det-imgs"><div class="det-imgs-h">Images <a onclick="T(\'All images\')">See all ('+imgs.length+')</a></div><div class="igrid">'+imgs.map(m=>'<img src="'+m.img+'" onclick="openLb(\''+m.img+'\')" onerror="this.remove()">').join('')+'</div></div>':'')
    +'</div></div>';
}
function closeDet(){document.getElementById('det').style.display='none';}

function showSett(){
  const s=document.getElementById('sett');s.style.display='flex';
  const ico=p=>'<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">'+p+'</svg>';
  const SR=(ic,t,sub,tog)=>'<div class="set-r"'+(tog===undefined?' onclick="T(\''+t+'\')"':'')+'>'+
    '<div class="set-r-ic">'+ic+'</div><div class="set-r-b"><h3>'+t+'</h3>'+(sub?'<p>'+sub+'</p>':'')+'</div>'+
    (tog!==undefined?'<button class="tog'+(tog?'':' off')+'" onclick="this.classList.toggle(\'off\')"></button>':'')+'</div>';
  s.innerHTML='<div style="display:flex;flex-direction:column;height:100dvh">'
    +'<div class="tb"><button class="ib" onclick="closeSett()"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></button><span class="tb-title">Settings</span></div>'

    +'<div class="set-s">'+SR(ico('<path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/>'),'Send photos faster','Resolution is reduced for faster sending',true)
    +SR(ico('<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>'),'Message sounds','Hear outgoing and incoming sounds',true)
    +SR(ico('<path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>'),'Pinch to zoom','Pinch to zoom text',true)
    +SR(ico('<path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/>'),'Expressive animations','Show animated reactions',true)+'</div>'
    +'<div class="set-s">'+SR(ico('<path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9c.83 0 1.5-.67 1.5-1.5 0-.39-.15-.74-.39-1.01-.23-.26-.38-.61-.38-.99 0-.83.67-1.5 1.5-1.5H16c2.76 0 5-2.24 5-5 0-4.42-4.03-8-9-8z"/>'),'Choose theme','System default')
    +SR(ico('<path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/>'),'Your country','United States')
    +SR(ico('<path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/>'),'Protection & Safety','')
    +SR(ico('<path d="M16 17.01V10h-2v7.01h-3L15 21l4-3.99h-3zM9 3L5 6.99h3V14h2V6.99h3L9 3z"/>'),'Swipe actions','Archive: swipe right / left')+'</div>'
    +'<div class="set-s">'+SR(ico('<path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>'),'Advanced','')
    +SR(ico('<path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>'),'About, terms & privacy','')+'</div>'
    +'</div></div>';
}
function closeSett(){document.getElementById('sett').style.display='none';}

function openLb(src){document.getElementById('lb').style.display='flex';document.getElementById('lb-img').src=src;}
function closeLb(){document.getElementById('lb').style.display='none';}

let tT;
function T(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('on');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('on'),2600);}

renderList(convs);
document.addEventListener('click',e=>{
  const ctx=document.getElementById('ctx');
  const ov=document.getElementById('ov');
  if(ctx.style.display!=='none'&&!ctx.contains(e.target))closeCtx();
  if(ov.style.display!=='none'&&!ov.contains(e.target))closeOv();
});

</script>
