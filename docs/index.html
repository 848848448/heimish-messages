<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Heimish Messages</title>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#0b57d0;
  --brand-dk:#0842a0;
  --brand-lt:#d3e3fd;
  --brand-lt2:#edf2fa;
  --bg:#f6f8fc;
  --surf:#fff;
  --surf2:#edf2fa;
  --bin:#e3e3e3;
  --bout:#1b6ef3;
  --bout-txt:#ffffff;
  --text:#1f1f1f;
  --text2:#444746;
  --meta:#444746;
  --meta-lt:#747775;
  --div:#c4c7c5;
  --div2:#e8eaed;
  --red:#b3261e;
  --red-lt:#f9dedc;
  --green:#146c2e;
  --sh1:0 1px 2px rgba(0,0,0,.1),0 1px 3px rgba(0,0,0,.08);
  --sh2:0 2px 6px rgba(0,0,0,.12);
  --sh3:0 4px 12px rgba(0,0,0,.15);
  --sh4:0 8px 24px rgba(0,0,0,.18);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:'Google Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text)}
.scr{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--brand-lt);transition:transform .3s cubic-bezier(.4,0,.2,1)}
.scr.right{transform:translateX(100%)}
.scr.left{transform:translateX(-28%);pointer-events:none}
.tb{background:var(--brand-lt);height:64px;display:flex;align-items:center;padding:0 4px;flex-shrink:0}
.tb-title{font-size:22px;font-weight:700;flex:1;padding:0 8px;color:var(--text)}
.tb-info{flex:1;min-width:0;padding:0 8px;cursor:pointer}
.tb-info h2{font-size:17px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-info p{font-size:12px;color:var(--meta);margin-top:1px}
.ib{background:none;border:none;color:var(--meta);cursor:pointer;width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s}
.ib:hover,.ib:active{background:var(--div2)}
#sbar{background:var(--surf);padding:8px 14px 12px;display:none}
.sw{background:var(--surf2);border-radius:28px;display:flex;align-items:center;padding:0 14px;gap:10px;height:48px}
.sw:focus-within{background:var(--surf2);box-shadow:0 0 0 2px var(--brand)}
.sw svg{flex-shrink:0;color:var(--meta)}
.sw input{flex:1;background:none;border:none;font-size:15px;color:var(--text);outline:none;font-family:inherit}
.sw input::placeholder{color:var(--meta-lt)}
#clist{flex:1;overflow-y:auto;background:var(--surf);overflow-x:hidden;border-radius:24px 24px 0 0}
.ci{display:flex;align-items:center;padding:8px 16px;gap:14px;cursor:pointer;position:relative;min-height:72px;transition:background .1s;overflow:hidden;border-radius:16px;margin:0 8px}
.ci:active{background:var(--div2)}
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;color:#fff;flex-shrink:0;overflow:hidden}
.ci-body{flex:1;min-width:0}
.ci-r1{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:3px}
.ci-name{font-size:16px;font-weight:400;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.ci-name.u{font-weight:700}
.ci-time{font-size:12px;color:var(--meta-lt);flex-shrink:0}
.ci-time.u{color:var(--brand);font-weight:500}
.ci-r2{display:flex;align-items:center;gap:6px}
.ci-snip{font-size:14px;color:var(--meta);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.ci-snip.u{color:var(--text2);font-weight:500}
.badge{background:var(--brand);color:#fff;border-radius:50%;min-width:20px;height:20px;padding:0 5px;font-size:11px;display:flex;align-items:center;justify-content:center;font-weight:700}
.ci-arch{position:absolute;right:0;top:0;bottom:0;width:80px;background:#5f6368;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;color:#fff;font-size:11px;font-weight:500;opacity:0;pointer-events:none}
#fab{position:fixed;bottom:24px;right:16px;height:56px;padding:0 20px 0 16px;background:var(--brand);border-radius:16px;display:flex;align-items:center;gap:10px;cursor:pointer;box-shadow:var(--sh3);z-index:20;border:none;font-family:inherit;font-size:15px;font-weight:600;color:#fff;transition:box-shadow .18s}
#fab:active{box-shadow:var(--sh3)}
#S-chat{background:var(--brand-lt)}
.cbg{flex:1;overflow-y:auto;padding:6px 12px;display:flex;flex-direction:column;justify-content:flex-end;min-height:0;background:var(--surf);border-radius:24px 24px 0 0}
.cbg>*{flex-shrink:0}
.dh{text-align:center;margin:10px 0 8px}
.dh span{display:inline-block;background:var(--surf2);padding:4px 12px;border-radius:10px;font-size:12px;color:var(--meta);font-weight:500}
.sys{text-align:center;font-size:12px;color:var(--meta);margin:4px 32px;line-height:1.5}
.brow{display:flex;margin:1px 0;align-items:flex-end;gap:4px}
.brow.in{padding-right:56px}
.brow.out{flex-direction:row-reverse;padding-left:56px}
.bub{border-radius:20px;overflow:hidden;max-width:100%}
.bub.in{background:var(--bin);border-bottom-left-radius:4px}
.bub.out{background:var(--bout);border-bottom-right-radius:4px}
.bub img{width:100%;max-width:260px;display:block}
.bt{font-size:15px;color:var(--text);line-height:1.5;word-break:break-word;white-space:pre-wrap;padding:10px 14px 2px}
.bub.out .bt{color:#fff}
.bf{display:flex;align-items:center;justify-content:flex-end;gap:3px;padding:2px 12px 8px}
.btime{font-size:11px;color:var(--meta-lt)}
.bub.out .btime{color:rgba(255,255,255,.7)}
.abub{display:flex;align-items:center;gap:10px;padding:10px 14px;min-width:200px}
.play{width:40px;height:40px;border-radius:50%;background:var(--brand);border:none;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.abar{flex:1;position:relative;height:36px;display:flex;align-items:center}
.awave{flex:1;height:3px;background:rgba(0,0,0,.12);border-radius:2px}
.adot{width:12px;height:12px;border-radius:50%;background:var(--brand);position:absolute;left:0;top:50%;transform:translateY(-50%)}
.adur{font-size:12px;color:var(--meta);min-width:34px;text-align:right}
.rqb{border-left:3px solid var(--brand);margin:8px 10px 4px;padding:6px 10px;background:rgba(11,87,208,.08);border-radius:0 8px 8px 0;cursor:pointer}
.rqb b{color:var(--brand);font-size:12px;display:block;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rqb span{font-size:13px;color:var(--meta);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bub.out .rqb{background:rgba(255,255,255,.15);border-left-color:rgba(255,255,255,.6)}
.bub.out .rqb b{color:rgba(255,255,255,.9)}
.bub.out .rqb span{color:rgba(255,255,255,.7)}
.warn{background:#fff;border-radius:14px;margin:6px 4px;padding:16px;box-shadow:var(--sh2);border:1px solid var(--div)}
.warn-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.warn-h b{font-size:15px;font-weight:600;color:var(--text)}
.warn ul{list-style:none;padding:0;margin-bottom:10px}
.warn ul li{font-size:13.5px;color:var(--meta);padding:2px 0 2px 14px;position:relative}
.warn ul li::before{content:'•';position:absolute;left:4px;color:var(--meta)}
.warn-link{color:var(--brand);font-size:13.5px;cursor:pointer;display:block;margin-bottom:12px;font-weight:500}
.warn-btns{display:flex;gap:8px}
.wb{flex:1;padding:10px;border-radius:24px;border:none;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.wb.spam{background:var(--red-lt);color:var(--red)}
.wb.stay{background:var(--brand-lt);color:var(--brand)}
.link-prev{display:flex;align-items:stretch;margin:4px 10px 6px;background:rgba(26,115,232,.05);border-radius:10px;overflow:hidden;cursor:pointer;border:1px solid rgba(26,115,232,.15)}
.lp-bar{width:3px;background:var(--brand);flex-shrink:0}
.lp-body{padding:7px 10px;flex:1;min-width:0}
.lp-title{font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lp-url{font-size:11px;color:var(--brand);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.compose{background:var(--surf);padding:6px 8px 10px;display:flex;align-items:flex-end;gap:6px;flex-shrink:0;border-radius:0 0 0 0}
.cinp-wrap{flex:1;background:var(--surf2);border-radius:28px;display:flex;align-items:flex-end;padding:4px 6px 4px 14px;gap:2px}
.cinp-wrap:focus-within{background:var(--surf2);box-shadow:0 0 0 2px var(--brand)}
.cinp{flex:1;background:none;border:none;padding:9px 0;font-size:15px;outline:none;font-family:inherit;resize:none;max-height:130px;line-height:1.4;color:var(--text);min-height:38px}
.cinp::placeholder{color:var(--meta-lt)}
.sbtn{background:var(--brand-lt);color:var(--brand);border:none;border-radius:50%;width:46px;height:46px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:background .15s,transform .1s}
.sbtn:active{transform:scale(.92)}
#iprev{display:none;padding:8px 12px;gap:8px;align-items:center;background:var(--surf)}
#ipimg{height:68px;width:68px;object-fit:cover;border-radius:12px}
.iprm{background:rgba(0,0,0,.5);color:#fff;border:none;border-radius:50%;width:22px;height:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;margin-top:-58px;margin-left:-22px;align-self:flex-start}
#rbar{display:none;background:var(--surf);padding:8px 12px;gap:10px;align-items:center;border-top:1px solid var(--div2)}
#rbar-txt{flex:1;border-left:3px solid var(--brand);padding:4px 10px;background:var(--brand-lt);border-radius:0 8px 8px 0;min-width:0;overflow:hidden}
#rbar-txt b{color:var(--brand);font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#rbar-txt span{font-size:13px;color:var(--meta);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#epanel{display:none;background:var(--surf);flex-direction:column;max-height:280px}
.etabs{display:flex;border-bottom:1px solid var(--div)}
.etab{flex:1;padding:11px;border:none;background:none;cursor:pointer;font-size:13px;font-weight:600;color:var(--meta);border-bottom:2px solid transparent;font-family:inherit}
.etab.on{color:var(--brand);border-bottom-color:var(--brand)}
.esrch{padding:8px 12px;border-bottom:1px solid var(--div)}
.esrch input{width:100%;padding:8px 14px;border-radius:20px;border:1px solid var(--div);font-size:13px;outline:none;background:var(--surf2);font-family:inherit}
.egrid{flex:1;overflow-y:auto;padding:6px;display:flex;flex-wrap:wrap}
.eg{width:40px;height:40px;display:flex;align-items:center;justify-content:center;font-size:24px;cursor:pointer;border-radius:8px;font-family:'Noto Color Emoji','Apple Color Emoji','Segoe UI Emoji',sans-serif}
.eg:active{background:var(--div2)}
#asheet{position:fixed;inset:0;z-index:100;display:none}
#abg{position:absolute;inset:0;background:rgba(0,0,0,.4)}
#abox{position:absolute;bottom:0;left:0;right:0;background:var(--brand-lt);border-radius:24px 24px 0 0;padding:6px 0 32px;max-height:70vh;display:flex;flex-direction:column}
.ash-bar{width:36px;height:4px;background:var(--div);border-radius:2px;margin:10px auto 12px;flex-shrink:0}
.agrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:8px 12px 16px}
.ach{display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;padding:10px 4px;border-radius:16px;transition:background .1s}
.ach:active{background:var(--div2)}
.ach-ic{width:50px;height:50px;border-radius:16px;display:flex;align-items:center;justify-content:center;background:var(--surf)}
.ach-lb{font-size:11px;color:var(--text);font-weight:500;text-align:center;line-height:1.2}
#ctx{position:fixed;z-index:200;background:var(--surf);border-radius:20px;box-shadow:var(--sh4);padding:0;min-width:190px;display:none;animation:pop .16s ease;overflow:hidden}
.react-bar{display:flex;gap:2px;padding:8px 10px;border-bottom:1px solid var(--div2)}
.react-bar span{font-size:24px;cursor:pointer;padding:4px 6px;border-radius:50%;font-family:'Noto Color Emoji','Apple Color Emoji','Segoe UI Emoji',sans-serif}
.react-bar span:active{background:var(--div2);transform:scale(1.2)}
.ctx-items{padding:6px 0}
.msg-react{display:flex;gap:2px;margin-top:-6px;margin-bottom:4px;padding:0 12px}
.msg-react-pill{background:var(--surf);border:1px solid var(--div2);border-radius:12px;padding:2px 6px;font-size:14px;display:flex;align-items:center;gap:3px;cursor:pointer;box-shadow:var(--sh1);font-family:'Noto Color Emoji','Apple Color Emoji','Segoe UI Emoji',sans-serif}
.msg-react-pill .rc{font-size:11px;color:var(--meta);font-family:inherit}
.smart-replies{display:flex;gap:8px;padding:8px 12px;overflow-x:auto;flex-shrink:0}
.smart-reply{background:var(--surf);border:1.5px solid var(--brand);border-radius:20px;padding:6px 16px;font-size:14px;color:var(--brand);font-weight:500;cursor:pointer;white-space:nowrap;font-family:inherit}
.smart-reply:active{background:var(--brand-lt)}
@keyframes pop{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:scale(1)}}
.cm{display:flex;align-items:center;gap:14px;padding:13px 18px;cursor:pointer;font-size:15px;color:var(--text)}
.cm:hover{background:var(--div2)}
.cm svg{flex-shrink:0;color:var(--meta)}
.cm.red{color:var(--red)}
.cm.red svg{color:var(--red)}
.ctx-sep{height:.5px;background:var(--div);margin:4px 0}
#ov{position:fixed;z-index:200;top:60px;right:6px;background:var(--surf);border-radius:20px;box-shadow:var(--sh4);padding:6px 0;min-width:230px;display:none;animation:pop .16s ease}
.ovi{display:flex;align-items:center;padding:14px 20px;cursor:pointer;font-size:15px;color:var(--text)}
.ovi:hover{background:var(--div2)}
.ovi.red{color:var(--red)}
.ov-sep{height:.5px;background:var(--div);margin:4px 0}
#det{position:fixed;inset:0;z-index:150;background:var(--brand-lt);display:none;flex-direction:column}
.dtb{background:var(--brand-lt);height:64px;display:flex;align-items:center;padding:0 4px}
.dtb h2{font-size:18px;font-weight:600;flex:1;padding:0 8px;color:var(--text)}
.det-hero{background:var(--surf2);padding:28px 16px 20px;display:flex;flex-direction:column;align-items:center;gap:6px}
.det-av{width:84px;height:84px;border-radius:50%;font-size:30px;font-weight:600;color:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden}
.det-name{font-size:20px;font-weight:600;color:var(--text)}
.det-num{font-size:14px;color:var(--meta)}
.det-acts{display:flex;background:var(--surf);border-bottom:1px solid var(--div);gap:4px;padding:8px 0}
.da{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 4px;cursor:pointer;border:none;background:none;font-family:inherit}
.da:hover{background:var(--div2)}
.da-ic{width:56px;height:40px;border-radius:20px;background:var(--brand-lt);display:flex;align-items:center;justify-content:center}
.da span{font-size:12px;color:var(--brand);font-weight:500}
.det-row{display:flex;align-items:center;gap:16px;padding:15px 18px;border-bottom:.5px solid var(--div);background:#fff;cursor:pointer}
.det-row:hover{background:var(--div2)}
.det-row-ic{color:var(--meta);flex-shrink:0}
.det-row h3{font-size:15px;color:var(--text);font-weight:400;flex:1}
.det-row.red h3,.det-row.red .det-row-ic{color:var(--red)}
.igrid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:12px 16px}
.igrid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;cursor:pointer}
#sett{position:fixed;inset:0;z-index:150;background:var(--brand-lt);display:none;flex-direction:column}
.set-s{background:var(--surf);margin-bottom:8px;border-radius:16px;overflow:hidden}
.set-r{display:flex;align-items:center;gap:16px;padding:14px 18px;border-bottom:.5px solid var(--div);cursor:pointer}
.set-r:last-child{border-bottom:none}
.set-r:active{background:var(--div2)}
.set-r-ic{color:var(--text);width:24px;flex-shrink:0;display:flex;justify-content:center}
.set-r-b{flex:1}
.set-r-b h3{font-size:15px;color:var(--text);font-weight:400}
.set-r-b p{font-size:13px;color:var(--meta);margin-top:1px}
.tog{width:52px;height:32px;border-radius:16px;background:var(--brand);position:relative;cursor:pointer;flex-shrink:0;border:2px solid var(--brand);transition:background .2s,border-color .2s}
.tog::after{content:'';position:absolute;width:24px;height:24px;border-radius:50%;background:#fff;top:2px;right:2px;transition:right .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tog.off{background:var(--surf2);border-color:var(--div)}
.tog.off::after{right:24px;background:var(--meta-lt);width:16px;height:16px;top:6px}
#pmenu{position:fixed;inset:0;z-index:150;background:var(--brand-lt);display:none;flex-direction:column}
.pmenu-hdr{padding:20px 16px;background:#fff;border-bottom:1px solid var(--div)}
.pmenu-email{font-size:13px;color:var(--meta);text-align:center;margin-bottom:8px}
.pmenu-av{width:72px;height:72px;border-radius:50%;background:var(--brand);display:flex;align-items:center;justify-content:center;font-size:28px;color:#fff;margin:0 auto 10px}
.pmenu-name{font-size:18px;font-weight:600;color:var(--text);text-align:center;margin-bottom:4px}
.tdot{width:7px;height:7px;border-radius:50%;background:var(--meta);display:inline-block;animation:tdot 1.2s infinite ease-in-out}
@keyframes tdot{0%,80%,100%{transform:scale(.5);opacity:.4}40%{transform:scale(1);opacity:1}}
.link-prev{display:flex;align-items:stretch;margin:4px 10px 6px;background:rgba(26,115,232,.05);border-radius:10px;overflow:hidden;cursor:pointer;border:1px solid rgba(26,115,232,.12)}
.lp-bar{width:3px;background:var(--brand);flex-shrink:0}
.lp-body{padding:7px 10px;flex:1;min-width:0}
.lp-title{font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lp-url{font-size:11px;color:var(--brand);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:300;display:none;flex-direction:column;align-items:center;justify-content:center;user-select:none}
#lb-media{max-width:100%;max-height:calc(100% - 80px);object-fit:contain;touch-action:none}
#lb-vid{max-width:100%;max-height:calc(100% - 80px);outline:none}
#lb-x{position:absolute;top:16px;right:16px;background:rgba(255,255,255,.15);border:none;color:#fff;border-radius:50%;width:42px;height:42px;cursor:pointer;display:flex;align-items:center;justify-content:center}

.lb-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.4);transition:background .2s,transform .2s}
.lb-dot.on{background:#fff;transform:scale(1.3)}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:rgba(32,33,36,.9);color:#fff;padding:10px 22px;border-radius:20px;font-size:14px;font-weight:500;opacity:0;transition:opacity .28s;pointer-events:none;z-index:400;white-space:nowrap}
#toast.on{opacity:1}
#pinned-bar .pin-inner{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--brand-lt);border-bottom:1px solid rgba(26,115,232,.15);cursor:pointer}
@keyframes slideIn{from{transform:translateX(100%)}to{transform:none}}
.subpage .set-r{cursor:pointer}
</style>
</head>
<body>

<!-- LIST -->
<div class="scr" id="S-list">
  <div class="tb">

<script>
const PAL=['#1F6F5C','#2E5E8C','#8C4A2E','#6A2E8C','#8C2E5E','#2E8C7A','#8C7A2E','#1A237E'];
const avc=s=>{let h=0;for(const c of(s||''))h=(h*31+c.charCodeAt(0))>>>0;return PAL[h%PAL.length]};
const ini=s=>((s||'?').trim()[0]||'?').toUpperCase();
const esc=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

// time helpers
const fmtList=ms=>{
  if(!ms)return'';
  const d=new Date(ms),n=new Date();
  if(d.toDateString()===n.toDateString())return d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
  const y=new Date(n);y.setDate(y.getDate()-1);
  if(d.toDateString()===y.toDateString())return'Yesterday';
  return d.toLocaleDateString([],{month:'short',day:'numeric'});
};
const fmtMsg=ms=>ms?new Date(ms).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}):'';
const fmtDay=ms=>{
  if(!ms)return'';
  const d=new Date(ms),n=new Date();
  if(d.toDateString()===n.toDateString())return'Today';
  const y=new Date(n);y.setDate(y.getDate()-1);
  if(d.toDateString()===y.toDateString())return'Yesterday';
  return d.toLocaleDateString([],{weekday:'long',month:'long',day:'numeric'});
};
const fmtDayTime=ms=>fmtDay(ms)+' \u2022 '+fmtMsg(ms);

// avatar
function mkAv(c,w,oc){
  const st='width:'+w+'px;height:'+w+'px;font-size:'+Math.floor(w*.38)+'px;'+(oc?'cursor:pointer;':'')+'flex-shrink:0;';
  if(c.photo)return '<img src="'+c.photo+'" class="av" style="'+st+'object-fit:cover"'+(oc?' onclick="'+oc+'"':'')+' onerror="this.remove()">';
  const inner=c.group?grpSvg(Math.floor(w*.5)):ini(c.name);
  return '<div class="av" style="'+st+'background:'+avc(c.addr)+'"'+(oc?' onclick="'+oc+'"':'')+'>'+inner+'</div>';
}
function grpSvg(sz){return '<svg width="'+sz+'" height="'+sz+'" viewBox="0 0 24 24" fill="#fff"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>';}

// data
const convs=[
  {id:1,name:'אברהם פֿאַלאַטשעק',addr:'+13475551234',snip:'Hey, wie geits?',date:Date.now()-2*60000,unread:2},
  {id:2,name:"ישעי' מערץ",addr:'+13475559876',snip:'וואס גייט פאר',date:Date.now()-16*60000,unread:0},
  {id:3,name:'ליפֿא מאַרק',addr:'+18455378946',snip:'Working SMS',date:Date.now()-86400000,unread:0,photo:'https://i.pravatar.cc/80?img=12'},

let swX0=null,swId=null,swEl=null;
function ciTouchStart(e,id){swX0=e.touches[0].clientX;swId=id;swEl=document.getElementById('ci'+id);if(swEl)swEl._swY0=e.touches[0].clientY;}
function ciTouchEnd(){
  if(swEl&&swX0!==null){
    const dx=swEl._swdx||0;
    if(dx<-60){swipeAction(swId);}
    else{swEl.style.transform='';swEl.style.transition='';}
  }
  swX0=null;swEl=null;swId=null;
}
document.addEventListener('touchmove',e=>{
  if(!swEl||swX0===null)return;
  const dx=e.touches[0].clientX-swX0;
  const dy=Math.abs(e.touches[0].clientY-(swEl._swY0||0));
  // cancel if moving vertically
  if(dy>30&&Math.abs(dx)<20){swEl=null;return;}
  swEl._swdx=dx;
  if(dx<0){
    swEl.style.transition='none';
    swEl.style.transform='translateX('+Math.max(dx,-80)+'px)';
    const arch=document.getElementById('arch'+swId);
    if(arch)arch.style.opacity=Math.min(1,Math.abs(dx)/60);
  }
},{passive:true});

  let _y0=null,_x0=null,_active=false;
  function _ts(e){
    if(e.touches.length!==1)return;
    // only start swipe-down gesture from top 70px of screen
    if(e.touches[0].clientY>70){_y0=null;return;}
    _y0=e.touches[0].clientY;_x0=e.touches[0].clientX;_active=false;

  function _tm(e){
    if(_y0===null)return;
    const dy=e.touches[0].clientY-_y0;

    // cancel if moving sideways more than 20px
    if(!_active&&dx>20){_y0=null;chat.style.transition='';return;}
    if(dy>0&&dx<20){

  if(tb._sd){tb.removeEventListener('touchstart',tb._sd[0]);tb.removeEventListener('touchmove',tb._sd[1]);tb.removeEventListener('touchend',tb._sd[2]);}

// ── SWIPE DOWN HELPER ────────────────────────────────────────────────────────
function addSwipeDown(elId, closeFn){
  // attach to the topbar inside the element so only header drag triggers it
  const el=document.getElementById(elId);
  if(!el)return;
  // find topbar inside (first .tb or .dtb child)
  const handle=el.querySelector('.tb,.dtb,.pmenu-hdr')||el;
  let y0=null,x0=null,act=false;
  function ts(e){
    if(e.touches.length!==1)return;
    // only trigger from top 60px of the element
    const rect=el.getBoundingClientRect();
    if(e.touches[0].clientY>rect.top+70){y0=null;return;}
    y0=e.touches[0].clientY;x0=e.touches[0].clientX;act=false;el.style.transition='none';
  }
  function tm(e){
    if(y0===null)return;
    const dy=e.touches[0].clientY-y0,dx=Math.abs(e.touches[0].clientX-x0);
    if(!act&&dx>20){y0=null;el.style.transition='';return;}
    if(dy>0&&dx<20){act=true;e.preventDefault();el.style.transform='translateY('+dy+'px)';el.style.opacity=String(1-Math.min(dy/300,1)*0.4);}
  }
  function te(e){
    if(y0===null)return;
    const dy=e.changedTouches[0].clientY-y0;
    el.style.transition='transform .28s cubic-bezier(.4,0,.2,1),opacity .28s';
    if(act&&dy>90){el.style.transform='translateY(100%)';el.style.opacity='0';setTimeout(()=>{el.style.transform='';el.style.opacity='';el.style.transition='';closeFn();},280);}
    else{el.style.transform='';el.style.opacity='';setTimeout(()=>el.style.transition='',300);}
    y0=null;x0=null;act=false;
  }
  if(handle._sd){handle.removeEventListener('touchstart',handle._sd[0]);handle.removeEventListener('touchmove',handle._sd[1]);handle.removeEventListener('touchend',handle._sd[2]);}
  handle.addEventListener('touchstart',ts,{passive:true});
  handle.addEventListener('touchmove',tm,{passive:false});
  handle.addEventListener('touchend',te,{passive:true});
  handle._sd=[ts,tm,te];
}

    },{passive:true});
  });

function doSend(){
  const inp=document.getElementById('cinp'),body=inp.value.trim();
  if(!body&&!pendImg&&!pendVideo)return;
  const m={id:Date.now(),body:body,date:Date.now(),in:false};
  if(pendImg)m.img=pendImg;
  if(pendVideo)m.video=pendVideo;
  // MMS when there's media or it's a group; otherwise SMS
  const conv=convs.find(x=>x.id===aid);
  m.mms=!!(pendImg||pendVideo||(conv&&conv.group));
  if(replyTo)m.replyTo=replyTo;
  if(!allMsgs[aid])allMsgs[aid]=[];
  m.sending=true;
  allMsgs[aid].push(m);
  const c=conv;
  if(c){c.snip=body||(pendVideo?'Video':pendImg?'Photo':'');c.date=m.date;}
  inp.value='';inp.style.height='auto';clearImg();clearReply();closeEmoji();resetBtn();
  renderMsgs(aid);renderList(convs);
  // mark as sent after short delay
  setTimeout(()=>{m.sending=false;renderMsgs(aid);},800);
  const _replyAid=aid;
  setTimeout(()=>{
    if(aid!==_replyAid)return;
    const rs=['\u05d0\u05b8\u05e7\u05e2\u05d9!','\ud83d\udc4d','\u05e4\u05bc\u05d0\u05e8\u05e9\u05d8\u05d0\u05e0\u05e2\u05df','\u05d9\u05d0\u05b8!','\u05e9\u05d9\u05d9\u05df!','\ud83d\udc4c','\ud83d\ude0a','\u05d1\u05e1\u05d3\u05e8!'];
    const r={id:Date.now()+1,body:rs[Math.floor(Math.random()*rs.length)],date:Date.now(),in:true};
    const cvg=convs.find(x=>x.id===_replyAid);
    if(cvg&&cvg.group&&cvg.members&&cvg.members.length)r.from=cvg.members[Math.floor(Math.random()*cvg.members.length)].name;
    allMsgs[_replyAid].push(r);const cv=cvg;
    if(cv){cv.snip=r.body;cv.date=r.date;}
    renderMsgs(_replyAid);renderList(convs);showSmartReplies();
  },1500);
}

function pickFile(inp){
  const f=inp.files[0];if(!f)return;
  const isVid=f.type.indexOf('video')===0;
  const r=new FileReader();
  r.onload=e=>{
    const ip=document.getElementById('iprev');
    const im=document.getElementById('ipimg');
    let vp=document.getElementById('ipvid');
    if(!vp){vp=document.createElement('video');vp.id='ipvid';vp.muted=true;vp.playsInline=true;vp.style.cssText='width:68px;height:68px;object-fit:cover;border-radius:10px';ip.insertBefore(vp,ip.firstChild);}
    if(isVid){pendVideo=e.target.result;pendImg=null;vp.src=e.target.result;vp.style.display='block';im.style.display='none';}
    else{pendImg=e.target.result;pendVideo=null;im.src=e.target.result;im.style.display='block';vp.style.display='none';}

    document.getElementById('sbtn-ico').setAttribute('d',SND);
    const b=document.getElementById('sbtn');b.style.background='var(--brand)';b.style.color='#fff';
  };
  r.readAsDataURL(f);inp.value='';
}

function openMediaGrid(kind){
  if(!aid){T('Open a chat first');return;}
  var cats = kind==='gif'
    ? ['happy','funny','love','yes','no','wow','thanks','ok','party','sad']
    : ['smile','heart','star','food','cat','dog','flower','sun','moon','tree'];
  var title = kind==='gif' ? 'GIFs' : 'Stickers';
  var h='<div style="padding:10px 14px"><div class="sw" style="margin-bottom:12px"><svg width="18" height="18" viewBox="0 0 24 24" fill="var(--meta)"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg><input id="mg-search" placeholder="Search '+title+'"></div>'
    +'<div id="mg-chips" style="display:flex;gap:6px;overflow-x:auto;padding-bottom:10px">'
    + cats.map(function(c){return '<button class="mg-chip" data-c="'+c+'" style="flex-shrink:0;background:var(--surf2);border:none;border-radius:16px;padding:7px 14px;font-size:13px;color:var(--text);cursor:pointer;font-family:inherit">'+c+'</button>';}).join('')
    +'</div>'
    +'<div id="mg-grid" style="display:grid;grid-template-columns:repeat('+(kind==='gif'?2:3)+',1fr);gap:6px"></div></div>';
  var p=subPage(title,h);
  var grid=p.querySelector('#mg-grid');
  function fill(q){
    grid.innerHTML='';
    for(var i=0;i<12;i++){
      var im=document.createElement('img');
      im.src='https://picsum.photos/seed/'+kind+(q||'all')+i+'/'+(kind==='gif'?'300/200':'200/200');
      im.style.cssText='width:100%;'+(kind==='gif'?'aspect-ratio:3/2':'aspect-ratio:1')+';object-fit:cover;border-radius:10px;cursor:pointer;background:var(--surf2)';
      (function(src){
        im.addEventListener('click',function(){
          var m={id:Date.now(),body:'',date:Date.now(),in:false,img:src,mms:true,kind:kind};
          if(!allMsgs[aid])allMsgs[aid]=[];
          allMsgs[aid].push(m);
          var c=convs.find(function(x){return x.id===aid;});
          if(c){c.snip=kind==='gif'?'GIF':'Sticker';c.date=m.date;}
          p.remove();renderMsgs(aid);renderList(convs);
        });
      })(im.src);
      grid.appendChild(im);
    }
  }
  fill('');
  p.querySelectorAll('.mg-chip').forEach(function(b){
    b.addEventListener('click',function(){
      p.querySelectorAll('.mg-chip').forEach(function(x){x.style.background='var(--surf2)';x.style.color='var(--text)';});
      this.style.background='var(--brand)';this.style.color='#fff';
      fill(this.dataset.c);
    });
  });
  p.querySelector('#mg-search').addEventListener('input',function(){fill(this.value);});
}

function openSelfieGif(){
  if(!aid){T('Open a chat first');return;}
  var h='<div style="padding:0"><div style="position:relative;background:#000;aspect-ratio:1;overflow:hidden">'
    +'<video id="sg-video" autoplay playsinline muted style="width:100%;height:100%;object-fit:cover;transform:scaleX(-1)"></video>'
    +'<div id="sg-count" style="position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:72px;font-weight:700;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.6)"></div>'
    +'</div>'
    +'<div style="padding:20px;text-align:center">'
    +'<div id="sg-hint" style="font-size:14px;color:var(--meta);margin-bottom:18px">Tap to capture a 4-frame selfie GIF</div>'
    +'<button id="sg-shoot" style="width:72px;height:72px;border-radius:50%;background:var(--brand);border:4px solid var(--brand-lt);cursor:pointer;display:flex;align-items:center;justify-content:center;margin:0 auto">'
    +'<svg width="30" height="30" viewBox="0 0 24 24" fill="#fff"><path d="M12 10.8c-1.98 0-3.6 1.62-3.6 3.6s1.62 3.6 3.6 3.6 3.6-1.62 3.6-3.6-1.62-3.6-3.6-3.6zM9 2L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2h-3.17L15 2H9z"/></svg></button>'
    +'<div id="sg-frames" style="display:flex;gap:6px;justify-content:center;margin-top:20px"></div>'
    +'</div></div>';
  var p=subPage('Selfie GIF',h);
  var video=p.querySelector('#sg-video'), stream=null, frames=[];
  if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){
    navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false})
      .then(function(s){stream=s;video.srcObject=s;})
      .catch(function(){p.querySelector('#sg-hint').textContent='Camera not available';});
  }
  p.querySelector('.sp-back').addEventListener('click',function(){if(stream)stream.getTracks().forEach(function(t){t.stop();});});
  p.querySelector('#sg-shoot').addEventListener('click',function(){
    if(!stream){T('Camera not available');return;}
    frames=[];
    var fw=p.querySelector('#sg-frames');fw.innerHTML='';
    var cd=p.querySelector('#sg-count');
    var n=0;
    cd.style.display='flex';
    var iv=setInterval(function(){
      n++;
      cd.textContent=n;
      var cv=document.createElement('canvas');
      cv.width=320;cv.height=320;
      var ctx=cv.getContext('2d');
      ctx.translate(320,0);ctx.scale(-1,1);
      ctx.drawImage(video,0,0,320,320);
      var d=cv.toDataURL('image/jpeg',0.8);
      frames.push(d);
      var th=document.createElement('img');
      th.src=d;th.style.cssText='width:52px;height:52px;object-fit:cover;border-radius:8px';
      fw.appendChild(th);
      if(n>=4){
        clearInterval(iv);cd.style.display='none';
        // animate through frames as the "GIF"
        var m={id:Date.now(),body:'',date:Date.now(),in:false,img:frames[0],frames:frames,mms:true,kind:'selfiegif'};
        if(!allMsgs[aid])allMsgs[aid]=[];
        allMsgs[aid].push(m);
        var c=convs.find(function(x){return x.id===aid;});
        if(c){c.snip='Selfie GIF';c.date=m.date;}
        if(stream)stream.getTracks().forEach(function(t){t.stop();});
        setTimeout(function(){p.remove();renderMsgs(aid);renderList(convs);T('Selfie GIF sent');},400);
      }
    },600);
  });
}

var SET=JSON.parse(localStorage.getItem('hm_set')||'{}');
function setGet(k,d){return SET[k]!==undefined?SET[k]:d;}
function setPut(k,v){SET[k]=v;localStorage.setItem('hm_set',JSON.stringify(SET));applySettings();}
function applySettings(){
  var r=document.documentElement;
  var th=setGet('theme','system');
  var dark = th==='dark' || (th==='system' && window.matchMedia && window.matchMedia('(prefers-color-scheme:dark)').matches);
  if(dark){
    r.style.setProperty('--bg','#131314');r.style.setProperty('--surf','#1e1f20');
    r.style.setProperty('--surf2','#2d2f31');r.style.setProperty('--text','#e3e3e3');
    r.style.setProperty('--text2','#c4c7c5');r.style.setProperty('--meta','#9aa0a6');
    r.style.setProperty('--meta-lt','#80868b');r.style.setProperty('--div','#444746');
    r.style.setProperty('--div2','#2d2f31');r.style.setProperty('--bin','#2d2f31');
    r.style.setProperty('--brand-lt','#0842a0');r.style.setProperty('--brand-lt2','#1f3760');
  } else {
    r.style.setProperty('--bg','#f6f8fc');r.style.setProperty('--surf','#fff');
    r.style.setProperty('--surf2','#edf2fa');r.style.setProperty('--text','#1f1f1f');
    r.style.setProperty('--text2','#444746');r.style.setProperty('--meta','#444746');
    r.style.setProperty('--meta-lt','#747775');r.style.setProperty('--div','#c4c7c5');
    r.style.setProperty('--div2','#e8eaed');r.style.setProperty('--bin','#e3e3e3');
    r.style.setProperty('--brand-lt','#d3e3fd');r.style.setProperty('--brand-lt2','#edf2fa');
  }
  var fs=setGet('fontSize',100);
  document.body.style.fontSize=(fs/100)+'rem';
  var bub=setGet('bubbleColor','#0b57d0');
  r.style.setProperty('--bout',bub);
  r.style.setProperty('--brand',bub);
}

function setRow(icoPath,title,sub,onclickStr){
  var oc=onclickStr||"T('"+title+"')";
  return '<div class="set-r" onclick="'+oc+'">'
    +'<div class="set-r-ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="'+icoPath+'"/></svg></div>'
    +'<div class="set-r-b"><h3>'+title+'</h3>'+(sub?'<p>'+sub+'</p>':'')+'</div>'
    +'<div class="arr"><svg width="18" height="18" viewBox="0 0 24 24" fill="var(--meta-lt)"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg></div></div>';
}
function setToggle(icoPath,title,sub,key,def){
  var on=setGet(key,def);
  return '<div class="set-r" onclick="toggleSet(this,\''+key+'\')"><div class="set-r-ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="'+icoPath+'"/></svg></div>'
    +'<div class="set-r-b"><h3>'+title+'</h3>'+(sub?'<p>'+sub+'</p>':'')+'</div>'
    +'<button class="tog'+(on?'':' off')+'"></button></div>';
}
function toggleSet(row,key){
  var b=row.querySelector('.tog');
  var nv=b.classList.contains('off');
  b.classList.toggle('off');
  setPut(key,nv);
}

// generic sub-page
function subPage(title,bodyHtml){
  var p=document.createElement('div');
  p.className='subpage';
  p.style.cssText='position:fixed;inset:0;z-index:170;background:var(--brand-lt);display:flex;flex-direction:column;animation:slideIn .25s ease';
  p.innerHTML='<div class="tb"><button class="ib sp-back"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></button><span class="tb-title">'+title+'</span></div>'
    +'<div style="flex:1;overflow-y:auto;background:var(--surf);border-radius:24px 24px 0 0;padding:8px 0">'+bodyHtml+'</div>';
  document.body.appendChild(p);
  p.querySelector('.sp-back').addEventListener('click',function(){p.remove();});
  return p;
}
function radioList(key,def,opts,cb){
  var cur=setGet(key,def);
  return opts.map(function(o){
    return '<div class="set-r" data-val="'+o.v+'"><div class="set-r-b"><h3>'+o.lb+'</h3>'+(o.sub?'<p>'+o.sub+'</p>':'')+'</div>'
      +'<div style="width:22px;height:22px;border-radius:50%;border:2px solid '+(cur===o.v?'var(--brand)':'var(--div)')+';display:flex;align-items:center;justify-content:center;flex-shrink:0">'
      +(cur===o.v?'<div style="width:12px;height:12px;border-radius:50%;background:var(--brand)"></div>':'')+'</div></div>';
  }).join('');
}
function wireRadio(panel,key,cb){
  panel.querySelectorAll('.set-r[data-val]').forEach(function(r){
    r.addEventListener('click',function(){
      var v=this.dataset.val;
      if(v==='true')v=true; else if(v==='false')v=false; else if(!isNaN(v)&&v!=='')v=+v;
      setPut(key,v);
      panel.querySelectorAll('.set-r[data-val]').forEach(function(x){
        var sel=String(x.dataset.val)===String(v);
        var c=x.lastElementChild;
        c.style.borderColor=sel?'var(--brand)':'var(--div)';
        c.innerHTML=sel?'<div style="width:12px;height:12px;border-radius:50%;background:var(--brand)"></div>':'';
      });
      if(cb)cb(v);
    });
  });
}

let lbItems=[],lbIdx=0;

function openLb(src,allSrcs){
  // build gallery from all images in current thread
  if(allSrcs){lbItems=allSrcs;}
  else{
    lbItems=(allMsgs[aid]||[]).filter(m=>m.img).map(m=>({src:m.img,type:'img'}));
    if(!lbItems.length)lbItems=[{src:src,type:'img'}];
  }
  lbIdx=lbItems.findIndex(x=>x.src===src);
  if(lbIdx<0)lbIdx=0;
  const lb=document.getElementById('lb');
  lb.style.display='flex';
  lbShow(lbIdx);
  lbSwipe();
}

function lbShow(i){
  lbIdx=Math.max(0,Math.min(i,lbItems.length-1));
  const item=lbItems[lbIdx];
  const img=document.getElementById('lb-media');
  const vid=document.getElementById('lb-vid');
  const isVid=item.src&&(item.src.includes('video')||item.type==='vid');
  img.style.display=isVid?'none':'block';
  vid.style.display=isVid?'block':'none';
  img.style.transform='';img.style.opacity='';
  if(isVid){vid.src=item.src;vid.play&&vid.play();}
  else{img.src=item.src;}
  // dots
  const dots=document.getElementById('lb-dots');
  if(lbItems.length>1){
    dots.innerHTML=lbItems.map((_,j)=>'<div class="lb-dot'+(j===lbIdx?' on':'')+'"></div>').join('');
  } else dots.innerHTML='';
  // counter
  document.getElementById('lb-counter').textContent=lbItems.length>1?(lbIdx+1)+' / '+lbItems.length:'';
  // nav visibility
  document.getElementById('lb-nav-l').style.opacity=lbIdx>0?'1':'0';
  document.getElementById('lb-nav-r').style.opacity=lbIdx<lbItems.length-1?'1':'0';
  // header info
  if(aid){const c=convs.find(x=>x.id===aid);if(c){document.getElementById('lb-name').textContent=c.name;}}
  const m=(allMsgs[aid]||[]).find(x=>x.img===item.src);
  document.getElementById('lb-time').textContent=m?fmtMsg(m.date):'';
}

function lbNav(dir){
  const newIdx=lbIdx+dir;
  if(newIdx<0||newIdx>=lbItems.length)return;
  document.getElementById('lb-menu').style.display='none';
  const img=document.getElementById('lb-media');
  img.style.transition='transform .22s,opacity .22s';
  img.style.transform='translateX('+(dir<0?'60px':'-60px')+')';
  img.style.opacity='0';
  setTimeout(()=>{lbShow(newIdx);img.style.transition='transform .22s,opacity .22s';img.style.transform='translateX('+(dir<0?'-30px':'30px')+')';img.style.opacity='0';setTimeout(()=>{img.style.transform='';img.style.opacity='';},20);},180);
}

function lbSwipe(){
  const lb=document.getElementById('lb');
  const img=document.getElementById('lb-media');
  let y0=null,x0=null,yAct=false,xAct=false;
  // pinch zoom state
  let scale=1,lastScale=1,pinching=false,baseX=0,baseY=0,panX=0,panY=0;

  function dist(e){return Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);}
  function mid(e){return{x:(e.touches[0].clientX+e.touches[1].clientX)/2,y:(e.touches[0].clientY+e.touches[1].clientY)/2};}

  let pinch0=0,pinchMid0={x:0,y:0};

  function ts(e){
    if(e.touches.length===2){
      // start pinch
      pinching=true;pinch0=dist(e);pinchMid0=mid(e);lastScale=scale;
      img.style.transition='none';
      return;
    }
    if(scale>1){
      // panning when zoomed in
      y0=e.touches[0].clientY;x0=e.touches[0].clientX;
      img.style.transition='none';
      return;
    }
    if(e.touches.length!==1)return;
    y0=e.touches[0].clientY;x0=e.touches[0].clientX;
    yAct=false;xAct=false;img.style.transition='none';
  }
  function tm(e){
    if(e.touches.length===2&&pinching){
      e.preventDefault();
      const d=dist(e);
      scale=Math.min(Math.max(lastScale*(d/pinch0),.5),5);
      const m=mid(e);
      panX+=m.x-pinchMid0.x;panY+=m.y-pinchMid0.y;pinchMid0=m;
      img.style.transform='translate('+panX+'px,'+panY+'px) scale('+scale+')';
      return;
    }
    if(scale>1&&e.touches.length===1){
      // pan while zoomed
      e.preventDefault();
      const dx=e.touches[0].clientX-x0,dy=e.touches[0].clientY-y0;
      img.style.transform='translate('+(panX+dx)+'px,'+(panY+dy)+'px) scale('+scale+')';
      return;
    }
    if(y0===null)return;
    const dy=e.touches[0].clientY-y0,dx=e.touches[0].clientX-x0;
    const adx=Math.abs(dx),ady=Math.abs(dy);
    if(!yAct&&!xAct){if(ady>adx&&ady>8)yAct=true;else if(adx>ady&&adx>8)xAct=true;else return;}
    if(yAct&&dy>0){
      e.preventDefault();
      img.style.transform='translateY('+dy+'px) scale('+(1-Math.min(dy/500,.15))+')';
      lb.style.background='rgba(0,0,0,'+(0.95-Math.min(dy/300,.7)*0.95)+')';
    } else if(xAct){
      e.preventDefault();
      img.style.transform='translateX('+dx*.4+'px)';
    }
  }
  function te(e){
    if(pinching&&e.touches.length<2){
      pinching=false;
      // snap back if too small
      if(scale<1){scale=1;panX=0;panY=0;}
      img.style.transition='transform .2s';
      img.style.transform='translate('+panX+'px,'+panY+'px) scale('+scale+')';
      if(e.touches.length===1){y0=e.touches[0]?.clientY;x0=e.touches[0]?.clientX;}
      else{y0=null;}
      return;
    }
    if(scale>1){
      // update pan base
      if(y0!==null&&e.changedTouches[0]){
        panX+=e.changedTouches[0].clientX-x0;
        panY+=e.changedTouches[0].clientY-y0;
        img.style.transform='translate('+panX+'px,'+panY+'px) scale('+scale+')';
      }
      y0=null;return;
    }
    if(y0===null)return;
    const dy=e.changedTouches[0].clientY-y0,dx=e.changedTouches[0].clientX-x0;
    img.style.transition='transform .28s cubic-bezier(.4,0,.2,1),opacity .28s';
    lb.style.transition='background .28s';
    if(yAct&&dy>100){
      img.style.transform='translateY(100vh) scale(.8)';img.style.opacity='0';
      lb.style.background='rgba(0,0,0,0)';
      setTimeout(()=>{closeLb();img.style.transition='';lb.style.transition='';scale=1;panX=0;panY=0;},280);
    } else if(xAct&&Math.abs(dx)>60){
      scale=1;panX=0;panY=0;lbNav(dx<0?1:-1);
    } else {
      img.style.transform='translate('+panX+'px,'+panY+'px) scale('+scale+')';
      lb.style.background='rgba(0,0,0,.95)';
      setTimeout(()=>{img.style.transition='';lb.style.transition='';},300);
    }
    y0=null;x0=null;yAct=false;xAct=false;
  }

  // double-tap to zoom
  let lastTap=0;
  function dtap(e){
    const now=Date.now();
    if(now-lastTap<300){
      e.preventDefault();
      if(scale>1){scale=1;panX=0;panY=0;}
      else{scale=2.5;panX=0;panY=0;}
      img.style.transition='transform .25s';
      img.style.transform='translate('+panX+'px,'+panY+'px) scale('+scale+')';
    }
    lastTap=now;
  }

  if(lb._sd){lb.removeEventListener('touchstart',lb._sd[0]);lb.removeEventListener('touchmove',lb._sd[1]);lb.removeEventListener('touchend',lb._sd[2]);lb.removeEventListener('touchend',lb._sd[3]);}
  lb.addEventListener('touchstart',ts,{passive:true});
  lb.addEventListener('touchmove',tm,{passive:false});
  lb.addEventListener('touchend',te,{passive:true});
  lb.addEventListener('touchend',dtap,{passive:false});
  lb._sd=[ts,tm,te,dtap];
}

let pinnedMsg=null;
function pinMsg(msgId){
  const m=(allMsgs[aid]||[]).find(x=>x.id===msgId);if(!m)return;
  pinnedMsg={id:aid,text:m.body||'Photo'};
  renderPinned();T('Message pinned');closeCtx();

function renderPinned(){
  let pin=document.getElementById('pinned-bar');
  if(!pinnedMsg||pinnedMsg.id!==aid){if(pin)pin.remove();return;}
  if(!pin){
    pin=document.createElement('div');pin.id='pinned-bar';
    const cbg=document.getElementById('cbg');

function showSmartReplies(){
  if(!setGet('smartReply',true)){var ex0=document.getElementById('smart-replies');if(ex0)ex0.remove();return;}
  const list=allMsgs[aid]||[];
  if(!list.length)return;
  const last=list[list.length-1];
  if(!last.in)return;
  const existing=document.getElementById('smart-replies');
  if(existing)existing.remove();
  // Context-aware replies based on last message
  var replies;
  var b=(last.body||'').toLowerCase();
  if(b.includes('wie geits')||b.includes('וואס מאכסטו')||b.includes('ווי גייט'))
    replies=['גוט ב״ה','שלום עליכם','וואס הערט זיך?','👍'];
  else if(b.includes('קומ')||b.includes('ביסטו'))
    replies=['בין שוין אונטערוועגס','5 מינוט','איך קום','👍'];
  else if(b.includes('שלום')||b.includes('היי')||b.includes('hey'))
    replies=['שלום!','וואס גייט?','היי!','👋'];
  else if(b.includes('?'))
    replies=['יא','ניין','אפשר','👍'];
  else if(b.includes('דאנק')||b.includes('thank'))
    replies=['בבקשה!','גערן געשען','👍','😊'];
  else if(b.match(/[😀-🙏🤣😂😊😎👍👌❤️]/u))
    replies=['😂','👍','❤️','😊'];
  else
    replies=['אקעי','👍','פארשטאנען','😊'];
  const div=document.createElement('div');div.id='smart-replies';div.className='smart-replies';
  replies.forEach(r=>{
    const btn=document.createElement('button');btn.className='smart-reply';btn.textContent=r;
    btn.addEventListener('click',()=>{
      // Auto-send immediately
      const m={id:Date.now(),body:r,date:Date.now(),in:false};
      if(!allMsgs[aid])allMsgs[aid]=[];
      allMsgs[aid].push(m);
      const c=convs.find(x=>x.id===aid);
      if(c){c.snip=r;c.date=m.date;}
      div.remove();
      renderMsgs(aid);renderList(convs);
    });
    div.appendChild(btn);
  });
  const cbg=document.getElementById('cbg');
  cbg.parentNode.insertBefore(div,cbg.nextSibling);
}

function scheduleSend(){
  const inp=document.getElementById('cinp');
  const body=inp.value.trim();
  if(!body){T('Type a message first');return;}
  const ctx=document.getElementById('ctx');
  ctx.innerHTML='';
  const items=document.createElement('div');items.className='ctx-items';
  const opts=[
    {lb:'In 10 seconds',ms:10000},
    {lb:'In 1 minute',ms:60000},
    {lb:'In 1 hour',ms:3600000},
    {lb:'Tomorrow 8:00 AM',ms:null},
  ];
  opts.forEach(o=>{
    const d=document.createElement('div');d.className='cm';d.textContent=o.lb;
    d.addEventListener('click',()=>{
      closeCtx();
      const target=aid,text=body;
      inp.value='';onType(inp);
      T('Scheduled: '+o.lb);
      const delay=o.ms||60000;
      setTimeout(()=>{
        const m={id:Date.now(),body:text,date:Date.now(),in:false,scheduled:true};
        if(!allMsgs[target])allMsgs[target]=[];
        allMsgs[target].push(m);
        const c=convs.find(x=>x.id===target);
        if(c){c.snip=text;c.date=m.date;}
        renderList(convs);
        if(aid===target)renderMsgs(target);
        T('Scheduled message sent');
      },delay);
    });
    items.appendChild(d);
  });
  ctx.appendChild(items);
  ctx.style.display='block';ctx.style.left='16px';ctx.style.bottom='90px';ctx.style.top='auto';
  setTimeout(()=>document.addEventListener('click',closeCtx,{once:true}),10);
}

function doForward(cid){
  if(!fwdMsg)return;
  const copy={id:Date.now(),body:fwdMsg.body||'',date:Date.now(),in:false,fwd:true};
  if(fwdMsg.img)copy.img=fwdMsg.img;
  if(fwdMsg.video)copy.video=fwdMsg.video;
  if(!allMsgs[cid])allMsgs[cid]=[];
  allMsgs[cid].push(copy);
  const c=convs.find(x=>x.id===cid);
  if(c){c.snip=copy.body||(copy.video?'Video':'Photo');c.date=copy.date;}
  document.getElementById('fwd').style.display='none';
  fwdMsg=null;
  renderList(convs);
  T('Forwarded');
  if(aid===cid)renderMsgs(aid);
}

      pendImg=this.src;document.getElementById('ipimg').src=this.src;
      document.getElementById('iprev').style.cssText='display:flex;align-items:center;gap:8px';
      document.getElementById('sbtn-ico').setAttribute('d',SND);
      var btn=document.getElementById('sbtn');btn.style.background='var(--brand)';btn.style.color='#fff';
      closeMediaPicker();
    });
    grid.appendChild(img);
  });
  var gal=document.getElementById('mp-gallery'),cam=document.getElementById('mp-cam'),y0=null;
  function ts(e){y0=e.touches[0].clientY;gal.style.transition='none';cam.style.transition='none';}
  function tm(e){if(y0===null)return;var dy=y0-e.touches[0].clientY;if(dy>0){e.preventDefault();cam.style.flex='0 0 '+Math.max(55-dy/3,0)+'%';}else{e.preventDefault();cam.style.flex='0 0 '+Math.min(55-dy/3,55)+'%';}}
  function te(e){if(y0===null)return;var dy=y0-e.changedTouches[0].clientY;gal.style.transition='flex .3s';cam.style.transition='flex .3s';if(dy>80)cam.style.flex='0 0 0%';else cam.style.flex='0 0 55%';setTimeout(function(){gal.style.transition='';cam.style.transition='';},300);y0=null;}
  if(gal._sd){gal.removeEventListener('touchstart',gal._sd[0]);gal.removeEventListener('touchmove',gal._sd[1]);gal.removeEventListener('touchend',gal._sd[2]);}
  gal.addEventListener('touchstart',ts,{passive:true});gal.addEventListener('touchmove',tm,{passive:false});gal.addEventListener('touchend',te,{passive:true});gal._sd=[ts,tm,te];
}
// Magic Compose: rewrite the current draft in a few tones
function magicCompose(){
  if(!setGet('magicCompose',true)){T('Magic Compose is off in Settings');return;}
  const inp=document.getElementById('cinp');
  const draft=inp.value.trim();
  if(!draft){T('Type something first');return;}
  const variants=[
    {lb:'Shorter',v:draft.split(/[.!?]/)[0].trim()||draft},
    {lb:'Polite',v:'זייט מוחל, '+draft},
    {lb:'Excited',v:draft.replace(/[.!]*$/,'')+'! 🎉'},
    {lb:'Formal',v:'איך וויל אײַך מודיע זײַן: '+draft},
  ];
  const ctx=document.getElementById('ctx');
  ctx.innerHTML='';
  const items=document.createElement('div');items.className='ctx-items';
  variants.forEach(x=>{
    const d=document.createElement('div');d.className='cm';
    d.innerHTML='<b style="color:var(--brand);margin-right:6px">'+x.lb+'</b> '+esc(x.v.slice(0,28))+(x.v.length>28?'…':'');
    d.addEventListener('click',()=>{closeCtx();inp.value=x.v;onType(inp);inp.focus();});
    items.appendChild(d);
  });
  ctx.appendChild(items);
  ctx.style.display='block';
  ctx.style.left='16px';
  ctx.style.bottom='90px';ctx.style.top='auto';
  setTimeout(()=>document.addEventListener('click',closeCtx,{once:true}),10);
}

// Video recording in media picker
var mpRecorder=null,mpChunks=[],mpMode='photo';
function setMpMode(mode){
  mpMode=mode;
  const vt=document.getElementById('mp-tab-video'),pt=document.getElementById('mp-tab-photo');
  const on='color:#fff;font-size:14px;font-weight:600;border-bottom:2px solid #fff;padding-bottom:2px;cursor:pointer';
  const off='color:rgba(255,255,255,.5);font-size:14px;font-weight:500;cursor:pointer;padding-bottom:2px';
  vt.style.cssText=mode==='video'?on:off;
  pt.style.cssText=mode==='photo'?on:off;
  const sh=document.getElementById('mp-shutter').firstElementChild;
  if(sh){sh.style.background=mode==='video'?'#e53935':'#fff';sh.style.borderRadius=mode==='video'?'8px':'50%';}
}
function startRec(){
  if(!mpStream)  {T('Camera not available');return;}
  try{
    mpChunks=[];
    mpRecorder=new MediaRecorder(mpStream);
    mpRecorder.ondataavailable=e=>{if(e.data.size)mpChunks.push(e.data);};
    mpRecorder.onstop=()=>{
      const blob=new Blob(mpChunks,{type:'video/webm'});
      const r=new FileReader();
      r.onload=e=>{
        pendVideo=e.target.result;pendImg=null;
        const ip=document.getElementById('iprev');
        let vp=document.getElementById('ipvid');
        if(!vp){vp=document.createElement('video');vp.id='ipvid';vp.muted=true;vp.playsInline=true;vp.style.cssText='width:68px;height:68px;object-fit:cover;border-radius:10px';ip.insertBefore(vp,ip.firstChild);}
        vp.src=e.target.result;vp.style.display='block';
        document.getElementById('ipimg').style.display='none';
        ip.style.cssText='display:flex;align-items:center;gap:8px';
        document.getElementById('sbtn-ico').setAttribute('d',SND);
        const b=document.getElementById('sbtn');b.style.background='var(--brand)';b.style.color='#fff';
        closeMediaPicker();
      };
      r.readAsDataURL(blob);
    };
    mpRecorder.start();
    T('Recording... tap again to stop');
  }catch(e){T('Recording not supported');}
}
function stopRec(){
  if(mpRecorder&&mpRecorder.state==='recording')mpRecorder.stop();
  mpRecorder=null;
}

function startCam(){
  var video=document.getElementById('mp-video');
  if(mpStream){mpStream.getTracks().forEach(function(t){t.stop();});}
  if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){
    navigator.mediaDevices.getUserMedia({video:{facingMode:mpFacing},audio:false})
    .then(function(stream){mpStream=stream;video.srcObject=stream;})
    .catch(function(){video.srcObject=null;});
  }
}
function closeMediaPicker(){
  if(mpRecorder&&mpRecorder.state==='recording'){try{mpRecorder.stop();}catch(e){}mpRecorder=null;}
  document.getElementById('mpicker').style.display='none';
  if(mpStream){mpStream.getTracks().forEach(function(t){t.stop();});mpStream=null;}
}
